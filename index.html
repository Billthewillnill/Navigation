<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Quick Launcher</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Clean focus styling */
        *:focus, *:focus-visible {
            outline: none;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Sleek custom scrollbars for results, history, and textarea */
        .custom-scroll {
            scrollbar-width: thin;
            scrollbar-color: rgba(100, 116, 139, 0.35) transparent;
            -webkit-overflow-scrolling: touch;
        }
        .dark .custom-scroll {
            scrollbar-color: rgba(148, 163, 184, 0.35) transparent;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(100, 116, 139, 0.3);
            border-radius: 9999px;
        }
        .dark .custom-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.3);
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background-color: rgba(100, 116, 139, 0.55);
        }
        .dark .custom-scroll::-webkit-scrollbar-thumb:hover {
            background-color: rgba(148, 163, 184, 0.55);
        }

        /* Subtle microphone pulse when Dictation Mode is active */
        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.45); }
            50% { box-shadow: 0 0 0 7px rgba(244, 63, 94, 0); }
        }
        .mic-active-pulse {
            animation: micPulse 1.8s infinite;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-[100dvh] flex flex-col overflow-x-hidden transition-colors duration-200 selection:bg-indigo-500/30 selection:text-indigo-900 dark:selection:text-indigo-200">

    <!-- Subtle Ambient Background Glow -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[640px] h-[320px] bg-indigo-500/10 dark:bg-indigo-600/10 blur-[120px] rounded-full"></div>
    </div>

    <!-- Main App Container -->
    <main id="mainWrapper" class="relative z-10 w-full mx-auto px-4 sm:px-6 py-5 sm:py-8 flex-1 flex flex-col transition-all duration-200 max-w-6xl">

        <!-- TOP: Revamped Clean Search Bar Section -->
        <section id="searchSection" class="w-full relative z-30 transition-all duration-200">
            <div id="searchBarShell" class="group relative flex items-center bg-white/95 dark:bg-slate-900/95 border border-slate-200 dark:border-slate-700/80 focus-within:border-indigo-500 dark:focus-within:border-indigo-400/80 focus-within:ring-4 focus-within:ring-indigo-500/15 rounded-2xl shadow-xl shadow-slate-900/5 dark:shadow-2xl dark:shadow-black/40 transition-all duration-200">
                
                <!-- Search Icon -->
                <div class="pl-4 pr-2.5 text-slate-400 group-focus-within:text-indigo-500 dark:group-focus-within:text-indigo-400 transition-colors shrink-0 pointer-events-none">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 105.65 5.65a7.5 7.5 0 0011 11z"/>
                    </svg>
                </div>

                <!-- Search Input (16px font prevents iOS Safari auto-zoom) -->
                <input
                    type="text"
                    id="searchInput"
                    autocomplete="off"
                    autocorrect="off"
                    spellcheck="false"
                    placeholder="Search tags, titles, or links..."
                    class="w-full bg-transparent py-3.5 sm:py-4 text-base text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 min-w-0"
                    autofocus
                >

                <!-- Right-Side Action Controls -->
                <div class="flex items-center gap-1 sm:gap-1.5 pr-2 sm:pr-2.5 shrink-0">
                    <!-- Clear Input Button (Visible only when text exists) -->
                    <button
                        id="clearSearchBtn"
                        type="button"
                        title="Clear search"
                        aria-label="Clear search"
                        class="hidden p-2 rounded-xl text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>

                    <!-- Enter Launch Pill (Hidden in Focus Mode and at Root; shown inside folders) -->
                    <span id="matchBadge" class="hidden md:inline-flex items-center gap-1 bg-indigo-500/10 dark:bg-indigo-500/15 text-indigo-600 dark:text-indigo-300 border border-indigo-500/25 dark:border-indigo-500/30 text-xs px-2.5 py-1.5 rounded-xl font-medium max-w-[190px] truncate">
                        ↵ Launch
                    </span>

                    <!-- Divider -->
                    <div class="h-6 w-px bg-slate-200 dark:bg-slate-800 mx-0.5"></div>

                    <!-- Light / Dark Theme Toggle (Appears only in Expanded View) -->
                    <button
                        id="themeToggleBtn"
                        type="button"
                        title="Switch Light / Dark Mode"
                        aria-label="Toggle Light or Dark Mode"
                        class="min-w-[40px] min-h-[40px] p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all flex items-center justify-center"
                    >
                        <svg id="themeToggleIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
                        </svg>
                    </button>

                    <!-- Dictation Mode Microphone Toggle -->
                    <button
                        id="dictationBtn"
                        type="button"
                        title="Toggle Dictation Mode (Say 'Open', 'Navigation', or 'Go to' + target)"
                        aria-label="Toggle Dictation Mode"
                        class="min-w-[40px] min-h-[40px] p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all flex items-center justify-center relative"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z"/>
                        </svg>
                    </button>

                    <!-- View Mode Toggle Icon (Search Bar Focus Mode <-> Expanded Folder & Save Data View) -->
                    <button
                        id="modeToggleBtn"
                        type="button"
                        title="Toggle Focus / Workspace View (Tab)"
                        aria-label="Toggle Focus or Workspace View"
                        class="min-w-[40px] min-h-[40px] p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all flex items-center justify-center"
                    >
                        <!-- Icon dynamically swapped via JS -->
                        <svg id="modeToggleIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Live Dictation Status Pill (Shown when Dictation is ON) -->
            <div id="dictationStatusBar" class="hidden mt-2 flex items-center justify-between gap-2 px-3.5 py-2 rounded-xl bg-rose-50 dark:bg-rose-500/10 border border-rose-200 dark:border-rose-500/25 text-xs text-rose-700 dark:text-rose-200">
                <div class="flex items-center gap-2 min-w-0">
                    <span id="dictationDot" class="w-2 h-2 rounded-full bg-rose-500 animate-pulse shrink-0"></span>
                    <span id="dictationStatusText" class="truncate">Listening — say "Open", "Navigation", or "Go to" + item</span>
                </div>
                <span id="dictationTranscript" class="text-slate-500 dark:text-slate-400 italic truncate max-w-[40%] hidden sm:inline"></span>
            </div>

            <!-- Focus Mode Scrollable Results Dropdown (Shows ALL matching results) -->
            <div
                id="focusResultsDropdown"
                class="hidden mt-2.5 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl shadow-slate-900/10 dark:shadow-2xl dark:shadow-black/50 p-2 max-h-[56dvh] sm:max-h-[60dvh] overflow-y-auto overscroll-contain custom-scroll space-y-1.5"
            >
                <!-- Dynamically filled in Focus Mode -->
            </div>
        </section>

        <!-- RECENT & STARRED HISTORY BAR (Directly under search bar in Expanded View) -->
        <section id="historySection" class="mt-3.5 w-full">
            <div id="historyBar" class="flex items-center gap-2 overflow-x-auto pb-1 custom-scroll">
                <!-- Dynamically filled with up to 5 recent / starred items -->
            </div>
        </section>

        <!-- EXPANDED WORKSPACE: Side-by-Side Folder Mode (Left) & Save Data (Right) -->
        <section id="workspaceSection" class="mt-4 flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-6 items-start">

            <!-- LEFT PANEL: Folder Mode & Search Results -->
            <div class="bg-white/85 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800/90 rounded-2xl p-3.5 sm:p-4 flex flex-col min-h-[340px] md:min-h-[520px] shadow-lg shadow-slate-900/5 dark:shadow-xl dark:shadow-black/20">
                <!-- Breadcrumbs Bar -->
                <div id="breadcrumbs" class="flex items-center gap-1.5 text-sm text-slate-600 dark:text-slate-300 overflow-x-auto pb-3 mb-3 border-b border-slate-200 dark:border-slate-800/80 custom-scroll">
                    <!-- Dynamically filled -->
                </div>

                <!-- Grid of Folders / Links / Search Results -->
                <div id="buttonsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 overflow-y-auto max-h-[55dvh] md:max-h-[60dvh] pr-0.5 custom-scroll">
                    <!-- Dynamically generated cards -->
                </div>

                <!-- Empty State -->
                <div id="noResults" class="hidden flex-1 flex flex-col items-center justify-center text-center py-12 text-slate-400 dark:text-slate-500">
                    <svg class="w-8 h-8 mb-2 text-slate-400 dark:text-slate-600" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 105.65 5.65a7.5 7.5 0 0011 11z"/>
                    </svg>
                    <p class="text-sm font-medium text-slate-500 dark:text-slate-400">No matching items</p>
                </div>
            </div>

            <!-- RIGHT PANEL: Save Data Editor (Always visible alongside Folder Mode) -->
            <div class="bg-white/85 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800/90 rounded-2xl p-3.5 sm:p-4 flex flex-col min-h-[340px] md:min-h-[520px] shadow-lg shadow-slate-900/5 dark:shadow-xl dark:shadow-black/20">
                <!-- Save Data Header with Undo, Redo, Copy & Paste Buttons -->
                <div class="flex flex-wrap items-center justify-between gap-2 pb-3 mb-3 border-b border-slate-200 dark:border-slate-800/80">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300">Save Data</span>
                        <span id="statusIndicator" class="text-xs text-emerald-600 dark:text-emerald-400 font-medium opacity-0 transition-opacity duration-200">Saved ✓</span>
                    </div>

                    <!-- Undo, Redo, Copy & Paste Action Buttons -->
                    <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
                        <button
                            id="undoDataBtn"
                            type="button"
                            title="Undo (Ctrl+Z)"
                            aria-label="Undo Save Data change"
                            class="min-h-[36px] px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 text-slate-700 dark:text-slate-200 text-xs font-medium border border-slate-200 dark:border-slate-700/80 transition-all flex items-center gap-1.5"
                        >
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"/>
                            </svg>
                            <span class="hidden sm:inline">Undo</span>
                        </button>
                        <button
                            id="redoDataBtn"
                            type="button"
                            title="Redo (Ctrl+Y)"
                            aria-label="Redo Save Data change"
                            class="min-h-[36px] px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 text-slate-700 dark:text-slate-200 text-xs font-medium border border-slate-200 dark:border-slate-700/80 transition-all flex items-center gap-1.5"
                        >
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 15l6-6m0 0l-6-6m6 6H9a6 6 0 000 12h3"/>
                            </svg>
                            <span class="hidden sm:inline">Redo</span>
                        </button>
                        <button
                            id="copyDataBtn"
                            type="button"
                            class="min-h-[36px] px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 text-slate-700 dark:text-slate-200 text-xs font-medium border border-slate-200 dark:border-slate-700/80 transition-all flex items-center gap-1.5"
                        >
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                            </svg>
                            <span id="copyBtnLabel">Copy</span>
                        </button>
                        <button
                            id="pasteDataBtn"
                            type="button"
                            class="min-h-[36px] px-3 py-1.5 rounded-xl bg-indigo-500/10 dark:bg-indigo-600/20 hover:bg-indigo-500/20 dark:hover:bg-indigo-600/35 active:scale-95 text-indigo-700 dark:text-indigo-300 hover:text-indigo-800 dark:hover:text-indigo-200 text-xs font-medium border border-indigo-500/25 dark:border-indigo-500/30 transition-all flex items-center gap-1.5"
                        >
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                            </svg>
                            <span id="pasteBtnLabel">Paste</span>
                        </button>
                    </div>
                </div>

                <!-- Save Data Textarea -->
                <textarea
                    id="dataInput"
                    spellcheck="false"
                    placeholder='(0){"Category", "Description", "tag", "https://example.com"}'
                    class="w-full flex-1 min-h-[260px] md:min-h-[430px] bg-slate-50 dark:bg-slate-950/90 border border-slate-200 dark:border-slate-800 focus:border-indigo-500 dark:focus:border-indigo-500/70 rounded-xl p-3.5 text-slate-800 dark:text-slate-200 font-mono text-sm leading-relaxed resize-y custom-scroll transition-colors"
                ></textarea>
            </div>
        </section>

    </main>

    <!-- Floating Context Menu for History Item 3-Dots Button (Never clipped by overflow) -->
    <div
        id="historyMenuPopover"
        class="hidden fixed z-50 w-44 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700/90 rounded-xl shadow-2xl shadow-slate-900/15 dark:shadow-black/70 p-1.5 text-sm"
    >
        <button
            id="popoverStarBtn"
            type="button"
            class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-left text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 active:bg-slate-200 dark:active:bg-slate-700 transition-colors"
        >
            <span id="popoverStarIcon" class="text-amber-500 dark:text-amber-400 text-base leading-none">★</span>
            <span id="popoverStarLabel" class="font-medium text-xs">Star to front</span>
        </button>
        <button
            id="popoverRemoveBtn"
            type="button"
            class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-left text-rose-600 dark:text-rose-300 hover:bg-rose-50 dark:hover:bg-rose-500/15 active:bg-rose-100 dark:active:bg-rose-500/25 transition-colors mt-0.5"
        >
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
            <span class="font-medium text-xs">Remove</span>
        </button>
    </div>

    <!-- Non-Blocking Toast Notification (Replaces any browser alerts) -->
    <div
        id="toastContainer"
        class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-200 opacity-0 translate-y-2 max-w-[92vw]"
    >
        <div id="toastMessage" class="pointer-events-auto bg-slate-900/95 dark:bg-slate-800/95 backdrop-blur border border-slate-700 text-slate-100 text-xs sm:text-sm font-medium px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2">
        </div>
    </div>

    <script>
        // =========================================================================
        // DEFAULT DATA & STORAGE KEYS
        // =========================================================================
        const STORAGE_KEYS = {
            DATA: 'quick_launcher_data',
            FOCUS_MODE: 'quick_launcher_focus_mode',
            HISTORY: 'quick_launcher_history_v1',
            DICTATION: 'quick_launcher_dictation_mode',
            THEME: 'quick_launcher_theme'
        };

        const defaultSaveData = `(0){"Local Files", "Files stored on this computer", "local", ""}
(1){"Computer Navigation", "Local AI canvas folder", "nav", "file:///C:/Users/super/Team%20KermitTF%20Dropbox/Super%20Herbie/IMPORTANT%20Computer%20Files%20I%20Want%20On%20Both%20Computers/For%20My%20PC/--%20AI%20Canvas%20--%20-/Computer%20Navigation/Computer%20Navigation.html"}
(0){"Developer Tools", "Coding platforms, version control, and documentation", "dev", "https://github.com/developer-notes"}
(1){"GitHub", "Code Repository & Version Control", "code", "https://github.com"}
(1){"MDN Web Docs", "JavaScript, HTML & CSS reference", "mdn", "https://developer.mozilla.org"}
(0){"Search & Knowledge", "General web search engines and knowledge bases", "search", "https://google.com"}
(1){"Google", "World search engine", "google", "https://google.com"}
(1){"Wikipedia", "Free online encyclopedia", "wiki", "https://wikipedia.org"}
(0){"Media", "Entertainment and videos", "media", "https://youtube.com"}
(1){"YouTube", "Video streaming platform", "yt", "https://youtube.com"}`;

        // =========================================================================
        // DOM REFERENCES
        // =========================================================================
        const mainWrapper = document.getElementById('mainWrapper');
        const searchSection = document.getElementById('searchSection');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const matchBadge = document.getElementById('matchBadge');
        const modeToggleBtn = document.getElementById('modeToggleBtn');
        const modeToggleIcon = document.getElementById('modeToggleIcon');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeToggleIcon = document.getElementById('themeToggleIcon');
        const dictationBtn = document.getElementById('dictationBtn');
        const dictationStatusBar = document.getElementById('dictationStatusBar');
        const dictationStatusText = document.getElementById('dictationStatusText');
        const dictationTranscript = document.getElementById('dictationTranscript');
        const dictationDot = document.getElementById('dictationDot');

        const focusResultsDropdown = document.getElementById('focusResultsDropdown');
        const historySection = document.getElementById('historySection');
        const historyBar = document.getElementById('historyBar');
        const workspaceSection = document.getElementById('workspaceSection');
        const breadcrumbs = document.getElementById('breadcrumbs');
        const buttonsGrid = document.getElementById('buttonsGrid');
        const noResults = document.getElementById('noResults');

        const dataInput = document.getElementById('dataInput');
        const statusIndicator = document.getElementById('statusIndicator');
        const undoDataBtn = document.getElementById('undoDataBtn');
        const redoDataBtn = document.getElementById('redoDataBtn');
        const copyDataBtn = document.getElementById('copyDataBtn');
        const copyBtnLabel = document.getElementById('copyBtnLabel');
        const pasteDataBtn = document.getElementById('pasteDataBtn');
        const pasteBtnLabel = document.getElementById('pasteBtnLabel');

        const historyMenuPopover = document.getElementById('historyMenuPopover');
        const popoverStarBtn = document.getElementById('popoverStarBtn');
        const popoverStarIcon = document.getElementById('popoverStarIcon');
        const popoverStarLabel = document.getElementById('popoverStarLabel');
        const popoverRemoveBtn = document.getElementById('popoverRemoveBtn');

        const toastContainer = document.getElementById('toastContainer');
        const toastMessage = document.getElementById('toastMessage');

        // =========================================================================
        // APPLICATION STATE
        // =========================================================================
        let rootNodes = [];
        let flatItems = [];
        let currentPath = [];
        let activeFilteredResults = [];
        let justOpenedFolderByEnter = false;

        // Only 2 modes: Focus Mode (search bar only) vs Expanded Workspace (Search + History + Folders & Save Data)
        let isFocusMode = localStorage.getItem(STORAGE_KEYS.FOCUS_MODE) === 'true';

        // Theme state: 'dark' or 'light'
        let currentTheme = localStorage.getItem(STORAGE_KEYS.THEME) || 'dark';

        // Save Data Undo / Redo history stacks
        let undoStack = [];
        let redoStack = [];
        let undoDebounceTimer = null;

        // History state: array of { link, title, tag, starred, timestamp }
        let historyItems = loadHistory();
        let activePopoverLink = null;

        // Dictation state (off by default, remembered across reloads)
        let isDictationOn = localStorage.getItem(STORAGE_KEYS.DICTATION) === 'true';
        let speechRecognition = null;
        let isRecognitionRunning = false;
        let dictationWaitingForQuery = false;
        let dictationWaitTimeout = null;
        let dictationRestartTimeout = null;
        let pendingGestureResume = false;

        // =========================================================================
        // UTILITY HELPERS
        // =========================================================================
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatUrl(url) {
            if (!url) return '';
            let formatted = url.trim();
            if (!formatted) return '';
            if (!/^(https?|file|vscode|mailto|tel):/i.test(formatted)) {
                formatted = 'https://' + formatted;
            }
            return formatted;
        }

        function getFolderPath(node) {
            const path = [];
            let curr = node ? node.parent : null;
            while (curr) {
                path.unshift(curr);
                curr = curr.parent;
            }
            return path;
        }

        let toastTimeout;
        function showToast(messageHtml, duration = 2200) {
            toastMessage.innerHTML = messageHtml;
            toastContainer.classList.remove('opacity-0', 'translate-y-2');
            toastContainer.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastContainer.classList.remove('opacity-100', 'translate-y-0');
                toastContainer.classList.add('opacity-0', 'translate-y-2');
            }, duration);
        }

        // =========================================================================
        // THEME MANAGEMENT (Light / Dark Mode)
        // =========================================================================
        function applyTheme(theme) {
            currentTheme = theme === 'light' ? 'light' : 'dark';
            localStorage.setItem(STORAGE_KEYS.THEME, currentTheme);

            if (currentTheme === 'dark') {
                document.documentElement.classList.add('dark');
                themeToggleBtn.title = 'Switch to Light Mode';
                // Sun icon indicates switching to Light Mode
                themeToggleIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>`;
            } else {
                document.documentElement.classList.remove('dark');
                themeToggleBtn.title = 'Switch to Dark Mode';
                // Moon icon indicates switching to Dark Mode
                themeToggleIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>`;
            }
        }

        function toggleTheme() {
            applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
        }

        // =========================================================================
        // HISTORY MANAGEMENT (Starred prioritized left, most recent left, max 5)
        // =========================================================================
        function loadHistory() {
            try {
                const raw = localStorage.getItem(STORAGE_KEYS.HISTORY);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        function saveHistory() {
            try {
                localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(historyItems));
            } catch (e) {
                console.error('Failed to save history:', e);
            }
        }

        function recordHistory(url, title, tag = '') {
            const cleanLink = formatUrl(url);
            if (!cleanLink) return;

            const existingIndex = historyItems.findIndex(item => item.link === cleanLink);
            const displayTitle = (title && title.trim()) ? title.trim() : cleanLink.replace(/^https?:\/\//i, '');

            if (existingIndex !== -1) {
                historyItems[existingIndex].timestamp = Date.now();
                if (title && title.trim()) historyItems[existingIndex].title = displayTitle;
                if (tag) historyItems[existingIndex].tag = tag;
            } else {
                historyItems.unshift({
                    link: cleanLink,
                    title: displayTitle,
                    tag: tag || '',
                    starred: false,
                    timestamp: Date.now()
                });
            }

            // Keep all starred items + up to 15 most recent unstarred items in storage
            const starred = historyItems.filter(i => i.starred);
            const unstarred = historyItems
                .filter(i => !i.starred)
                .sort((a, b) => b.timestamp - a.timestamp)
                .slice(0, 15);
            historyItems = [...starred, ...unstarred];

            saveHistory();
            renderHistoryBar();
        }

        function getDisplayedHistory() {
            // Starred items prioritized on the left (most recently updated/starred first),
            // followed by unstarred items with most recent on the left, up to 5 total boxes
            // (If user stars more than 5 items, all starred items remain visible).
            const starred = historyItems
                .filter(item => item.starred)
                .sort((a, b) => (b.starredAt || b.timestamp) - (a.starredAt || a.timestamp));
            const unstarred = historyItems
                .filter(item => !item.starred)
                .sort((a, b) => b.timestamp - a.timestamp);

            const maxSlots = Math.max(5, starred.length);
            return [...starred, ...unstarred].slice(0, maxSlots);
        }

        function toggleStarHistoryItem(link) {
            const item = historyItems.find(i => i.link === link);
            if (!item) return;
            item.starred = !item.starred;
            if (item.starred) {
                item.starredAt = Date.now();
            }
            saveHistory();
            renderHistoryBar();
        }

        function removeHistoryItem(link) {
            historyItems = historyItems.filter(i => i.link !== link);
            saveHistory();
            renderHistoryBar();
        }

        function closeHistoryPopover() {
            historyMenuPopover.classList.add('hidden');
            activePopoverLink = null;
        }

        function openHistoryPopover(anchorEl, item) {
            activePopoverLink = item.link;
            popoverStarIcon.textContent = item.starred ? '☆' : '★';
            popoverStarLabel.textContent = item.starred ? 'Unstar' : 'Star to front';

            historyMenuPopover.classList.remove('hidden');

            // Position safely within viewport bounds
            const rect = anchorEl.getBoundingClientRect();
            const popWidth = 176;
            const popHeight = 96;
            let left = rect.right - popWidth;
            let top = rect.bottom + 6;

            if (left < 10) left = 10;
            if (left + popWidth > window.innerWidth - 10) {
                left = window.innerWidth - popWidth - 10;
            }
            if (top + popHeight > window.innerHeight - 10) {
                top = rect.top - popHeight - 6;
            }

            historyMenuPopover.style.left = `${left}px`;
            historyMenuPopover.style.top = `${top}px`;
        }

        function renderHistoryBar() {
            if (isFocusMode) {
                historySection.classList.add('hidden');
                return;
            }

            historySection.classList.remove('hidden');
            const items = getDisplayedHistory();
            historyBar.innerHTML = '';

            if (items.length === 0) {
                historyBar.innerHTML = `
                    <div class="w-full text-xs text-slate-500 dark:text-slate-500 px-3.5 py-2.5 rounded-xl bg-white/70 dark:bg-slate-900/40 border border-dashed border-slate-300 dark:border-slate-800/90 flex items-center gap-2">
                        <svg class="w-3.5 h-3.5 text-slate-400 dark:text-slate-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span>Your last 5 opened links will appear here</span>
                    </div>
                `;
                return;
            }

            items.forEach(item => {
                const box = document.createElement('div');
                box.className = `group shrink-0 flex items-center justify-between gap-2 pl-3.5 pr-1.5 py-2 rounded-xl border transition-all cursor-pointer select-none min-w-[140px] max-w-[230px] sm:flex-1 sm:min-w-[150px] ${
                    item.starred
                        ? 'bg-amber-50 dark:bg-amber-500/10 hover:bg-amber-100/80 dark:hover:bg-amber-500/15 border-amber-300 dark:border-amber-500/35 text-amber-900 dark:text-amber-100'
                        : 'bg-white/90 dark:bg-slate-900/80 hover:bg-slate-100 dark:hover:bg-slate-800/90 border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 text-slate-700 dark:text-slate-200'
                }`;

                box.innerHTML = `
                    <div class="flex items-center gap-2 min-w-0">
                        ${item.starred
                            ? '<span class="text-amber-500 dark:text-amber-400 text-xs shrink-0" title="Starred">★</span>'
                            : '<span class="text-slate-400 dark:text-slate-500 text-xs shrink-0">↗</span>'}
                        <span class="text-xs sm:text-sm font-medium truncate">${escapeHtml(item.title)}</span>
                    </div>
                    <button
                        type="button"
                        aria-label="Options for ${escapeHtml(item.title)}"
                        class="history-dots-btn shrink-0 w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200/80 dark:hover:bg-slate-700/80 active:scale-95 transition-all"
                    >
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"/>
                        </svg>
                    </button>
                `;

                // Clicking the box re-opens the link
                box.addEventListener('click', () => {
                    closeHistoryPopover();
                    openLink(item.link, { title: item.title, tag: item.tag });
                });

                // Clicking the 3 dots opens the Star/Remove popover
                const dotsBtn = box.querySelector('.history-dots-btn');
                dotsBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (activePopoverLink === item.link && !historyMenuPopover.classList.contains('hidden')) {
                        closeHistoryPopover();
                    } else {
                        openHistoryPopover(dotsBtn, item);
                    }
                });

                historyBar.appendChild(box);
            });
        }

        // =========================================================================
        // LINK OPENER (Supports https, file:///, vscode://, mailto:, tel:)
        // =========================================================================
        function openLink(url, meta = null) {
            if (!url) return;
            const formattedUrl = formatUrl(url);

            // Record in history
            const matchedItem = meta || flatItems.find(i => formatUrl(i.link) === formattedUrl);
            recordHistory(formattedUrl, matchedItem ? matchedItem.title : '', matchedItem ? matchedItem.tag : '');

            // Launch link via anchor element (reliable for file:/// and vscode:// protocols)
            try {
                const link = document.createElement('a');
                link.href = formattedUrl;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (err) {
                console.error('Error opening link:', err);
                showToast('Could not automatically open link.');
            }

            // Always clear the search bar whenever a link opens (in both modes)
            if (searchInput.value !== '') {
                searchInput.value = '';
                render();
            }
        }

        // =========================================================================
        // SAVE DATA PARSER & TREE BUILDER
        // =========================================================================
        function parseSaveData(rawText) {
            const lines = rawText.split('\n');
            const items = [];

            lines.forEach((line, index) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                const regex = /^(?:\((\d+)\))?\s*\{?\s*"([^"]*)"\s*,\s*"([^"]*)"\s*,\s*"([^"]*)"\s*,\s*"([^"]*)"\s*\}?/;
                const match = trimmed.match(regex);

                if (match) {
                    const depth = match[1] !== undefined ? parseInt(match[1], 10) : 0;
                    items.push({
                        id: index,
                        depth: depth,
                        title: match[2],
                        description: match[3],
                        tag: match[4],
                        link: match[5],
                        children: [],
                        parent: null,
                        path: []
                    });
                }
            });

            return buildTree(items);
        }

        function buildTree(items) {
            const roots = [];
            const stack = [];

            items.forEach(item => {
                const depth = item.depth;
                while (stack.length > depth) stack.pop();

                if (depth === 0 || stack.length === 0) {
                    item.parent = null;
                    item.path = [item.title];
                    roots.push(item);
                } else {
                    const parent = stack[stack.length - 1];
                    item.parent = parent;
                    item.path = [...parent.path, item.title];
                    parent.children.push(item);
                }
                stack[depth] = item;
            });

            return { roots, items };
        }

        // =========================================================================
        // SEARCH SCORING (Prioritizes tags, then titles, supports voice spacing)
        // =========================================================================
        function calculateSearchScore(item, query) {
            const q = query.toLowerCase().trim();
            if (!q) return 0;

            const qCompact = q.replace(/\s+/g, '');
            const tag = (item.tag || '').toLowerCase();
            const title = (item.title || '').toLowerCase();
            const desc = (item.description || '').toLowerCase();
            const tagCompact = tag.replace(/\s+/g, '');
            const titleCompact = title.replace(/\s+/g, '');

            if (tag === q) return 1000;
            if (tagCompact && tagCompact === qCompact) return 960;
            if (tag.startsWith(q)) return 900 - (tag.length - q.length);
            if (tag.includes(q)) return 800;

            if (title === q) return 550;
            if (titleCompact && titleCompact === qCompact) return 520;
            if (title.startsWith(q)) return 420;
            if (title.includes(q)) return 320;
            if (titleCompact && qCompact.length >= 2 && titleCompact.includes(qCompact)) return 260;

            if (desc.includes(q)) return 100;

            // Multi-word fallback: all words appear in tag + title + desc
            const words = q.split(/\s+/).filter(Boolean);
            if (words.length > 1) {
                const haystack = `${tag} ${title} ${desc}`;
                if (words.every(w => haystack.includes(w))) return 220;
            }

            return 0;
        }

        function getContextItems() {
            if (isFocusMode) {
                return flatItems.filter(item => item.link && item.link.trim().length > 0);
            }
            if (currentPath.length === 0) return flatItems;

            const currentFolder = currentPath[currentPath.length - 1];
            const descendants = [];
            function collect(node) {
                node.children.forEach(child => {
                    descendants.push(child);
                    collect(child);
                });
            }
            collect(currentFolder);
            return descendants;
        }

        function getFirstLinkInFolder(folderNode) {
            if (folderNode.link && folderNode.link.trim().length > 0) {
                return { link: folderNode.link, title: folderNode.title, tag: folderNode.tag };
            }
            for (const child of folderNode.children) {
                const found = getFirstLinkInFolder(child);
                if (found) return found;
            }
            return null;
        }

        // =========================================================================
        // RENDERING PIPELINE
        // =========================================================================
        function updateModeToggleVisuals() {
            if (isFocusMode) {
                modeToggleBtn.title = 'Switch to Folders & Save Data View (Tab)';
                modeToggleBtn.classList.add('text-indigo-600', 'dark:text-indigo-400', 'bg-indigo-500/15');
                modeToggleBtn.classList.remove('text-slate-500', 'dark:text-slate-400');
                // Layout grid icon (indicates clicking opens full workspace)
                modeToggleIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h4.5A2.25 2.25 0 0112.75 6v12a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18V6zM15.75 6A2.25 2.25 0 0118 3.75h.75A2.25 2.25 0 0121 6v12a2.25 2.25 0 01-2.25 2.25H18A2.25 2.25 0 0115.75 18V6z"/>`;
                // Hide Light/Dark mode button in Focus Mode
                themeToggleBtn.classList.add('hidden');
            } else {
                modeToggleBtn.title = 'Switch to Search Bar Focus Mode (Tab)';
                modeToggleBtn.classList.remove('text-indigo-600', 'dark:text-indigo-400', 'bg-indigo-500/15');
                modeToggleBtn.classList.add('text-slate-500', 'dark:text-slate-400');
                // Focus/target icon (indicates clicking enters Search-only focus mode)
                modeToggleIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25"/>`;
                // Show Light/Dark mode button in Expanded View
                themeToggleBtn.classList.remove('hidden');
            }
        }

        function render() {
            const query = searchInput.value.trim();

            // Show/hide clear search button
            if (query.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }

            updateModeToggleVisuals();

            if (isFocusMode) {
                // FOCUS MODE: Vertically & horizontally centered; shifts smoothly upward as results appear so everything stays centered
                mainWrapper.className = 'relative z-10 w-full mx-auto px-4 sm:px-6 py-6 flex-1 flex flex-col justify-center max-w-2xl transition-all duration-200';
                workspaceSection.classList.add('hidden');
                historySection.classList.add('hidden');

                if (query.length === 0) {
                    focusResultsDropdown.classList.add('hidden');
                    focusResultsDropdown.innerHTML = '';
                    activeFilteredResults = [];
                } else {
                    renderFocusSearchResults(query);
                }
            } else {
                // EXPANDED WORKSPACE: Search Bar on top -> History Bar -> Side-by-Side Folders & Save Data
                mainWrapper.className = 'relative z-10 w-full mx-auto px-4 sm:px-6 py-4 sm:py-6 flex-1 flex flex-col max-w-6xl transition-all duration-200';
                focusResultsDropdown.classList.add('hidden');
                workspaceSection.classList.remove('hidden');

                renderHistoryBar();
                renderBreadcrumbs();

                if (query.length > 0) {
                    renderWorkspaceSearchResults(query);
                } else {
                    renderFolderView();
                }
            }

            updateMatchBadge(query);
        }

        function getScoredResults(query) {
            const contextPool = getContextItems();
            const scored = contextPool
                .map(item => ({ item, score: calculateSearchScore(item, query) }))
                .filter(entry => entry.score > 0);
            scored.sort((a, b) => b.score - a.score);
            return scored.map(entry => entry.item);
        }

        function renderFocusSearchResults(query) {
            // Show ALL matching results (no 3-item cap), smoothly scrollable with wheel or touch
            activeFilteredResults = getScoredResults(query);
            focusResultsDropdown.classList.remove('hidden');
            focusResultsDropdown.innerHTML = '';

            if (activeFilteredResults.length === 0) {
                focusResultsDropdown.innerHTML = `
                    <div class="py-6 text-center text-slate-500 dark:text-slate-400 text-sm">
                        No matching links found for "<span class="text-slate-800 dark:text-slate-200">${escapeHtml(query)}</span>"
                    </div>
                `;
                return;
            }

            activeFilteredResults.forEach((item, index) => {
                focusResultsDropdown.appendChild(createCardElement(item, index === 0, true));
            });
        }

        function renderWorkspaceSearchResults(query) {
            activeFilteredResults = getScoredResults(query);
            buttonsGrid.innerHTML = '';

            if (activeFilteredResults.length === 0) {
                buttonsGrid.classList.add('hidden');
                noResults.classList.remove('hidden');
            } else {
                buttonsGrid.classList.remove('hidden');
                noResults.classList.add('hidden');
                activeFilteredResults.forEach((item, index) => {
                    buttonsGrid.appendChild(createCardElement(item, index === 0, true));
                });
            }
        }

        function renderFolderView() {
            let currentLevelItems = [];
            if (currentPath.length === 0) {
                currentLevelItems = rootNodes;
            } else {
                const currentFolder = currentPath[currentPath.length - 1];
                currentLevelItems = currentFolder.children;
            }

            activeFilteredResults = currentLevelItems;
            buttonsGrid.innerHTML = '';

            if (currentLevelItems.length === 0) {
                buttonsGrid.classList.add('hidden');
                noResults.classList.remove('hidden');
            } else {
                buttonsGrid.classList.remove('hidden');
                noResults.classList.add('hidden');
                currentLevelItems.forEach((item, index) => {
                    buttonsGrid.appendChild(createCardElement(item, index === 0 && justOpenedFolderByEnter, false));
                });
            }
        }

        function createCardElement(item, isTopMatch, isSearchMode) {
            const hasChildren = item.children && item.children.length > 0;
            const hasLink = item.link && item.link.trim().length > 0;
            const showAsFolder = !isFocusMode && hasChildren;

            btn.type = 'button';
