<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Quick Launcher</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Clean focus styling */
        *:focus, *:focus-visible {
            outline: none;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Sleek custom scrollbars for results, history, and textarea */
        .custom-scroll {
            scrollbar-width: thin;
            scrollbar-color: rgba(100, 116, 139, 0.35) transparent;
            -webkit-overflow-scrolling: touch;
        }
        .dark .custom-scroll {
            scrollbar-color: rgba(148, 163, 184, 0.35) transparent;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(100, 116, 139, 0.3);
            border-radius: 9999px;
        }
        .dark .custom-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.3);
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background-color: rgba(100, 116, 139, 0.55);
        }
        .dark .custom-scroll::-webkit-scrollbar-thumb:hover {
            background-color: rgba(148, 163, 184, 0.55);
        }

        /* Subtle microphone pulse when Dictation Mode is active */
        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.45); }
            50% { box-shadow: 0 0 0 7px rgba(244, 63, 94, 0); }
        }
        .mic-active-pulse {
            animation: micPulse 1.8s infinite;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-[100dvh] flex flex-col overflow-x-hidden transition-colors duration-200 selection:bg-indigo-500/30 selection:text-indigo-900 dark:selection:text-indigo-200">

    <!-- Subtle Ambient Background Glow -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[640px] h-[320px] bg-indigo-500/10 dark:bg-indigo-600/10 blur-[120px] rounded-full"></div>
    </div>

    <!-- Main App Container -->
    <main id="mainWrapper" class="relative z-10 w-full mx-auto px-4 sm:px-6 py-5 sm:py-8 flex-1 flex flex-col transition-all duration-200 max-w-6xl">

        <!-- TOP: Revamped Clean Search Bar Section -->
        <section id="searchSection" class="w-full relative z-30 transition-all duration-200">
            <div id="searchBarShell" class="group relative flex items-center bg-white/95 dark:bg-slate-900/95 border border-slate-200 dark:border-slate-700/80 focus-within:border-indigo-500 dark:focus-within:border-indigo-400/80 focus-within:ring-4 focus-within:ring-indigo-500/15 rounded-2xl shadow-xl shadow-slate-900/5 dark:shadow-2xl dark:shadow-black/40 transition-all duration-200">
                
                <!-- Search Icon -->
                <div class="pl-4 pr-2.5 text-slate-400 group-focus-within:text-indigo-500 dark:group-focus-within:text-indigo-400 transition-colors shrink-0 pointer-events-none">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 105.65 5.65a7.5 7.5 0 0011 11z"/>
                    </svg>
                </div>

                <!-- Search Input (16px font prevents iOS Safari auto-zoom) -->
                <input
                    type="text"
                    id="searchInput"
                    autocomplete="off"
                    autocorrect="off"
                    spellcheck="false"
                    placeholder="Search tags, titles, or links..."
                    class="w-full bg-transparent py-3.5 sm:py-4 text-base text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 min-w-0"
                    autofocus
                >

                <!-- Right-Side Action Controls -->
                <div class="flex items-center gap-0.5 sm:gap-1.5 pr-1.5 sm:pr-2.5 shrink-0">
                    <!-- Clear Input Button (Visible only when text exists) -->
                    <button
                        id="clearSearchBtn"
                        type="button"
                        title="Clear search"
                        aria-label="Clear search"
                        class="hidden p-1.5 sm:p-2 rounded-xl text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>

                    <!-- Enter Launch Pill (Hidden in Focus Mode and at Root; shown inside folders) -->
                    <span id="matchBadge" class="hidden md:inline-flex items-center gap-1 bg-indigo-500/10 dark:bg-indigo-500/15 text-indigo-600 dark:text-indigo-300 border border-indigo-500/25 dark:border-indigo-500/30 text-xs px-2.5 py-1.5 rounded-xl font-medium max-w-[190px] truncate">
                        ↵ Launch
                    </span>

                    <!-- Divider -->
                    <div class="h-6 w-px bg-slate-200 dark:bg-slate-800 mx-0.5"></div>

                    <!-- Light / Dark Theme Toggle (Appears only in Expanded View) -->
                    <button
                        id="themeToggleBtn"
                        type="button"
                        title="Switch Light / Dark Mode"
                        aria-label="Toggle Light or Dark Mode"
                        class="min-w-[36px] min-h-[36px] sm:min-w-[40px] sm:min-h-[40px] p-1.5 sm:p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all flex items-center justify-center"
                    >
                        <svg id="themeToggleIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
                        </svg>
                    </button>

                    <!-- Dictation Mode Microphone Toggle -->
                    <button
                        id="dictationBtn"
                        type="button"
                        title="Toggle Dictation Mode ('Open', 'Search', 'YouTube Search', 'GPT Search', 'Copy', plus '... Start / Stop')"
                        aria-label="Toggle Dictation Mode"
                        class="min-w-[36px] min-h-[36px] sm:min-w-[40px] sm:min-h-[40px] p-1.5 sm:p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all flex items-center justify-center relative"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z"/>
                        </svg>
                    </button>

                    <!-- Copy Link Mode Toggle (Available in Focus & Expanded Views, next to App Clipboard) -->
                    <button
                        id="copyLinkModeBtn"
                        type="button"
                        title="Toggle Copy Link Mode (Click items to copy their link instead of opening)"
                        aria-label="Toggle Copy Link Mode"
                        class="min-w-[36px] min-h-[36px] sm:min-w-[40px] sm:min-h-[40px] p-1.5 sm:p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all flex items-center justify-center relative"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244"/>
                        </svg>
                    </button>

                    <!-- App Clipboard Spot (Click to copy stored item, Hover to inspect contents) -->
                    <div id="appClipboardWrapper" class="relative group/clip">
                        <button
                            id="appClipboardBtn"
                            type="button"
                            aria-label="Copy from App Clipboard"
                            class="min-w-[36px] min-h-[36px] sm:min-w-[40px] sm:min-h-[40px] p-1.5 sm:p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all flex items-center justify-center relative"
                        >
                            <svg id="appClipboardIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                            </svg>
                            <!-- Small dot shown when App Clipboard holds content -->
                            <span id="appClipboardDot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-indigo-500 ring-2 ring-white dark:ring-slate-900"></span>
                        </button>

                        <!-- Hover Tooltip Previewing Current App Clipboard Contents -->
                        <div
                            id="appClipboardTooltip"
                            class="pointer-events-none opacity-0 translate-y-1 group-hover/clip:opacity-100 group-hover/clip:translate-y-0 transition-all duration-150 absolute right-0 top-full mt-2 w-64 sm:w-80 z-50 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700/90 rounded-xl shadow-2xl shadow-slate-900/15 dark:shadow-black/70 p-3 text-left"
                        >
                            <div class="flex items-center justify-between gap-2 mb-1">
                                <span class="text-[10px] font-semibold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">App Clipboard</span>
                                <span class="text-[10px] text-slate-400 dark:text-slate-500">Click icon to copy</span>
                            </div>
                            <p id="appClipboardTooltipTitle" class="hidden text-xs font-semibold text-slate-800 dark:text-slate-100 truncate mb-0.5"></p>
                            <p id="appClipboardTooltipValue" class="text-xs font-mono text-slate-600 dark:text-slate-300 break-all line-clamp-3">
                                Empty — click a link or say "Copy ..."
                            </p>
                        </div>
                    </div>

                    <!-- View Mode Toggle Icon (Search Bar Focus Mode <-> Expanded Folder & Save Data View) -->
                    <button
                        id="modeToggleBtn"
                        type="button"
                        title="Toggle Focus / Workspace View (Tab)"
                        aria-label="Toggle Focus or Workspace View"
                        class="min-w-[36px] min-h-[36px] sm:min-w-[40px] sm:min-h-[40px] p-1.5 sm:p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all flex items-center justify-center"
                    >
                        <!-- Icon dynamically swapped via JS -->
                        <svg id="modeToggleIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Live Dictation Status Pill (Shown when Dictation is ON) -->
            <div id="dictationStatusBar" class="hidden mt-2 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 sm:gap-2 px-3.5 py-2 rounded-xl bg-rose-50 dark:bg-rose-500/10 border border-rose-200 dark:border-rose-500/25 text-xs text-rose-700 dark:text-rose-200">
                <div class="flex items-center gap-2 min-w-0">
                    <span id="dictationDot" class="w-2 h-2 rounded-full bg-rose-500 animate-pulse shrink-0"></span>
                    <span id="dictationStatusText" class="truncate">Listening — say "Open", "Search", "YouTube Search", "GPT Search", or "Copy"</span>
                </div>
                <div class="flex items-center justify-between sm:justify-end gap-2 shrink-0">
                    <span id="dictationTranscript" class="text-slate-600 dark:text-slate-300 italic truncate max-w-[220px] sm:max-w-[200px]"></span>
                    <button
                        id="dictationFinishHoldBtn"
                        type="button"
                        class="hidden px-2.5 py-1 rounded-lg bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-medium text-xs transition-all shrink-0"
                    >
                        Stop &amp; Run
                    </button>
                    <button
                        id="dictationResumeBtn"
                        type="button"
                        class="hidden px-2.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-medium text-xs transition-all shrink-0"
                    >
                        Resume Mic
                    </button>
                </div>
            </div>

            <!-- Focus Mode Scrollable Results Dropdown (Shows ALL matching results) -->
            <div
                id="focusResultsDropdown"
                class="hidden mt-2.5 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl shadow-slate-900/10 dark:shadow-2xl dark:shadow-black/50 p-2 max-h-[56dvh] sm:max-h-[60dvh] overflow-y-auto overscroll-contain custom-scroll space-y-1.5"
            >
                <!-- Dynamically filled in Focus Mode -->
            </div>
        </section>

        <!-- RECENT & STARRED HISTORY BAR (Directly under search bar in Expanded View) -->
        <section id="historySection" class="mt-3.5 w-full">
            <div id="historyBar" class="flex items-center gap-2 overflow-x-auto pb-1 custom-scroll">
                <!-- Dynamically filled with up to 5 recent / starred items -->
            </div>
        </section>

        <!-- EXPANDED WORKSPACE: Side-by-Side Folder Mode (Left) & Save Data (Right) -->
        <section id="workspaceSection" class="mt-4 flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-6 items-start">

            <!-- LEFT PANEL: Folder Mode & Search Results -->
            <div class="bg-white/85 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800/90 rounded-2xl p-3.5 sm:p-4 flex flex-col min-h-[340px] md:min-h-[520px] shadow-lg shadow-slate-900/5 dark:shadow-xl dark:shadow-black/20">
                <!-- Breadcrumbs Bar & Copy Link Mode Status Pill -->
                <div class="flex items-center justify-between gap-2 pb-3 mb-3 border-b border-slate-200 dark:border-slate-800/80">
                    <div id="breadcrumbs" class="flex items-center gap-1.5 text-sm text-slate-600 dark:text-slate-300 overflow-x-auto custom-scroll min-w-0 flex-1">
                        <!-- Dynamically filled -->
                    </div>
                    <button
                        id="copyModeIndicator"
                        type="button"
                        title="Click to exit Copy Link Mode"
                        class="hidden shrink-0 items-center gap-1.5 px-2.5 py-1 rounded-lg bg-emerald-500/15 border border-emerald-500/35 text-emerald-700 dark:text-emerald-300 text-[11px] font-semibold hover:bg-emerald-500/25 active:scale-95 transition-all"
                    >
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        <span>Copy Mode</span>
                    </button>
                </div>

                <!-- Grid of Folders / Links / Search Results -->
                <div id="buttonsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 overflow-y-auto max-h-[55dvh] md:max-h-[60dvh] pr-0.5 custom-scroll">
                    <!-- Dynamically generated cards -->
                </div>

                <!-- Empty State -->
                <div id="noResults" class="hidden flex-1 flex flex-col items-center justify-center text-center py-12 text-slate-400 dark:text-slate-500">
                    <svg class="w-8 h-8 mb-2 text-slate-400 dark:text-slate-600" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 105.65 5.65a7.5 7.5 0 0011 11z"/>
                    </svg>
                    <p class="text-sm font-medium text-slate-500 dark:text-slate-400">No matching items</p>
                </div>
            </div>

            <!-- RIGHT PANEL: Save Data Editor (Always visible alongside Folder Mode) -->
            <div class="bg-white/85 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800/90 rounded-2xl p-3.5 sm:p-4 flex flex-col min-h-[340px] md:min-h-[520px] shadow-lg shadow-slate-900/5 dark:shadow-xl dark:shadow-black/20">
                <!-- Save Data Header with Undo, Redo, Copy & Paste Buttons -->
                <div class="flex flex-wrap items-center justify-between gap-2 pb-3 mb-3 border-b border-slate-200 dark:border-slate-800/80">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300">Save Data</span>
                        <span id="statusIndicator" class="text-xs text-emerald-600 dark:text-emerald-400 font-medium opacity-0 transition-opacity duration-200">Saved ✓</span>
                    </div>

                    <!-- Undo, Redo, Copy & Paste Action Buttons -->
                    <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
                        <button
                            id="undoDataBtn"
                            type="button"
                            title="Undo (Ctrl+Z)"
                            aria-label="Undo Save Data change"
                            class="min-h-[36px] px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 text-slate-700 dark:text-slate-200 text-xs font-medium border border-slate-200 dark:border-slate-700/80 transition-all flex items-center gap-1.5"
                        >
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"/>
                            </svg>
                            <span class="hidden sm:inline">Undo</span>
                        </button>
                        <button
                            id="redoDataBtn"
                            type="button"
                            title="Redo (Ctrl+Y)"
                            aria-label="Redo Save Data change"
                            class="min-h-[36px] px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 text-slate-700 dark:text-slate-200 text-xs font-medium border border-slate-200 dark:border-slate-700/80 transition-all flex items-center gap-1.5"
                        >
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 15l6-6m0 0l-6-6m6 6H9a6 6 0 000 12h3"/>
                            </svg>
                            <span class="hidden sm:inline">Redo</span>
                        </button>
                        <button
                            id="copyDataBtn"
                            type="button"
                            class="min-h-[36px] px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 text-slate-700 dark:text-slate-200 text-xs font-medium border border-slate-200 dark:border-slate-700/80 transition-all flex items-center gap-1.5"
                        >
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                            </svg>
                            <span id="copyBtnLabel">Copy</span>
                        </button>
                        <button
                            id="pasteDataBtn"
                            type="button"
                            class="min-h-[36px] px-3 py-1.5 rounded-xl bg-indigo-500/10 dark:bg-indigo-600/20 hover:bg-indigo-500/20 dark:hover:bg-indigo-600/35 active:scale-95 text-indigo-700 dark:text-indigo-300 hover:text-indigo-800 dark:hover:text-indigo-200 text-xs font-medium border border-indigo-500/25 dark:border-indigo-500/30 transition-all flex items-center gap-1.5"
                        >
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                            </svg>
                            <span id="pasteBtnLabel">Paste</span>
                        </button>
                    </div>
                </div>

                <!-- Save Data Textarea -->
                <textarea
                    id="dataInput"
                    spellcheck="false"
                    placeholder='(0){"Category", "Description", "tag", "https://example.com"}'
                    class="w-full flex-1 min-h-[260px] md:min-h-[430px] bg-slate-50 dark:bg-slate-950/90 border border-slate-200 dark:border-slate-800 focus:border-indigo-500 dark:focus:border-indigo-500/70 rounded-xl p-3.5 text-slate-800 dark:text-slate-200 font-mono text-sm leading-relaxed resize-y custom-scroll transition-colors"
                ></textarea>
            </div>
        </section>

    </main>

    <!-- Floating Context Menu for History Item 3-Dots Button (Never clipped by overflow) -->
    <div
        id="historyMenuPopover"
        class="hidden fixed z-50 w-44 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700/90 rounded-xl shadow-2xl shadow-slate-900/15 dark:shadow-black/70 p-1.5 text-sm"
    >
        <button
            id="popoverStarBtn"
            type="button"

        // =========================================================================

        function safeGetStorage(key, fallback = null) {

        let rootNodes = [];

        // =========================================================================
        // CORE UTILITIES (HTML Escaping, URL Formatting, Tree Paths, Toasts)
        // =========================================================================
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatUrl(url) {
            if (!url) return '';
            const trimmed = url.trim();
            if (/^(https?|file|vscode|mailto|tel):/i.test(trimmed)) {
                return trimmed;
            }
            return 'https://' + trimmed;
        }

        function getFolderPath(node) {
            const path = [];
            let curr = node ? node.parent : null;
            while (curr) {
                path.unshift(curr);
                curr = curr.parent;
            }
            return path;
        }

        function showToast(htmlMessage, duration = 2400, action = null) {
            clearTimeout(toastTimer);
            toastMessage.innerHTML = htmlMessage;

            if (action && action.label && typeof action.onClick === 'function') {
                const actionBtn = document.createElement('button');
                actionBtn.type = 'button';
                actionBtn.textContent = action.label;
                actionBtn.className = 'ml-1 px-2.5 py-1 rounded-lg bg-indigo-500 hover:bg-indigo-400 active:scale-95 text-white text-xs font-semibold transition-all shrink-0';
                actionBtn.addEventListener('click', () => {
                    action.onClick();
                });
                toastMessage.appendChild(actionBtn);
            }

            toastContainer.classList.remove('opacity-0', 'translate-y-2');
            toastContainer.classList.add('opacity-100', 'translate-y-0');

            toastTimer = setTimeout(() => {
                toastContainer.classList.add('opacity-0', 'translate-y-2');
                toastContainer.classList.remove('opacity-100', 'translate-y-0');
            }, duration);
        }

        // =========================================================================
        // APP CLIPBOARD & COPY LINK MODE
        // =========================================================================
        function loadAppClipboard() {
            try {
                const raw = localStorage.getItem(STORAGE_KEYS.APP_CLIPBOARD);
                if (!raw) return { value: '', title: '' };
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed.value === 'string') {
                    return {
                        value: parsed.value,
                        title: typeof parsed.title === 'string' ? parsed.title : ''
                    };
                }
            } catch (e) {}
            return { value: '', title: '' };
        }

        function setAppClipboard(value, title = '') {
            appClipboard = {
                value: String(value || ''),
                title: String(title || '')
            };
            try {
                localStorage.setItem(STORAGE_KEYS.APP_CLIPBOARD, JSON.stringify(appClipboard));
            } catch (e) {}
            updateAppClipboardUI();
        }

        function updateAppClipboardUI() {
            const hasContent = Boolean(appClipboard && appClipboard.value);
            if (hasContent) {
                appClipboardDot.classList.remove('hidden');
                if (appClipboard.title) {
                    appClipboardTooltipTitle.textContent = appClipboard.title;
                    appClipboardTooltipTitle.classList.remove('hidden');
                } else {
                    appClipboardTooltipTitle.textContent = '';
                    appClipboardTooltipTitle.classList.add('hidden');
                }
                appClipboardTooltipValue.textContent = appClipboard.value;
            } else {
                appClipboardDot.classList.add('hidden');
                appClipboardTooltipTitle.textContent = '';
                appClipboardTooltipTitle.classList.add('hidden');
                appClipboardTooltipValue.textContent = 'Empty — click a link or say "Copy ..."';
            }
        }

        async function copyTextToSystemClipboard(text, successToastText = null, allowFallbackButton = false) {
            let copied = false;
            const prevActive = document.activeElement;

            // Primary method: document.execCommand('copy') works reliably in iframes and local files
            try {
                const tempTextarea = document.createElement('textarea');
                tempTextarea.value = text;
                tempTextarea.setAttribute('readonly', '');
                tempTextarea.style.position = 'fixed';
                tempTextarea.style.top = '-9999px';
                tempTextarea.style.left = '-9999px';
                tempTextarea.style.opacity = '0';
                document.body.appendChild(tempTextarea);
                tempTextarea.focus();
                tempTextarea.select();
                tempTextarea.setSelectionRange(0, tempTextarea.value.length);
                copied = document.execCommand('copy');
                document.body.removeChild(tempTextarea);
            } catch (e) {
                copied = false;
            }

            if (!isMobileDevice && prevActive && typeof prevActive.focus === 'function') {
                try {
                    prevActive.focus({ preventScroll: true });
                } catch (e) {}
            }

            // Secondary fallback to Async Clipboard API
            if (!copied && navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    copied = true;
                } catch (e) {
                    copied = false;
                }
            }

            if (copied) {
                if (successToastText) {
                    showToast(successToastText);
                }
                return true;
            }

            if (allowFallbackButton) {
                showToast(
                    '<span>Saved to App Clipboard</span>',
                    5000,
                    {
                        label: 'Tap to Copy',
                        onClick: () => copyTextToSystemClipboard(text, '📋 Copied to clipboard')
                    }
                );
            } else {
                showToast('Could not copy automatically — please copy manually.', 2800);
            }
            return false;
        }

        async function copyFromAppClipboard(prefixIcon = '📋') {
            if (!appClipboard || !appClipboard.value) {
                showToast(`${prefixIcon} App Clipboard is empty`);
                return false;
            }
            const label = appClipboard.title || appClipboard.value;
            const shortLabel = label.length > 42 ? label.slice(0, 42) + '…' : label;
            const isVoice = prefixIcon.includes('🎙️');
            const ok = await copyTextToSystemClipboard(
                appClipboard.value,
                `${prefixIcon} Copied "${escapeHtml(shortLabel)}"`,
                isVoice
            );
            if (ok) {
                appClipboardBtn.classList.add('text-emerald-600', 'dark:text-emerald-400', 'bg-emerald-500/15');
                setTimeout(() => {
                    appClipboardBtn.classList.remove('text-emerald-600', 'dark:text-emerald-400', 'bg-emerald-500/15');
                }, 900);
            }
            return ok;
        }

        function updateCopyLinkModeUI() {
            if (isCopyLinkMode) {
                copyLinkModeBtn.classList.add('bg-emerald-500/20', 'text-emerald-600', 'dark:text-emerald-400');
                copyLinkModeBtn.classList.remove('text-slate-500', 'dark:text-slate-400');
                copyLinkModeBtn.title = 'Copy Link Mode ON (Click to switch back to opening links)';
                if (!isFocusMode) {
                    copyModeIndicator.classList.remove('hidden');
                    copyModeIndicator.classList.add('inline-flex');

            } else {
                copyLinkModeBtn.classList.remove('bg-emerald-500/20', 'text-emerald-600', 'dark:text-emerald-400');
                copyLinkModeBtn.classList.add('text-slate-500', 'dark:text-slate-400');
                copyLinkModeBtn.title = 'Toggle Copy Link Mode (Click items to copy their link instead of opening)';
                copyModeIndicator.classList.add('hidden');
                copyModeIndicator.classList.remove('inline-flex');

        function toggleCopyLinkMode() {
            isCopyLinkMode = !isCopyLinkMode;
            try {

            updateCopyLinkModeUI();
            showToast(isCopyLinkMode ? '🔗 Copy Link Mode ON — clicking items copies their link' : '🔗 Copy Link Mode OFF');

        async function copyItemLink(url, meta = null) {
            if (!url) return;
            const formattedUrl = formatUrl(url);
            const matchedItem = meta || flatItems.find(i => formatUrl(i.link) === formattedUrl);
            const title = matchedItem ? matchedItem.title : '';

            setAppClipboard(formattedUrl, title);

            const label = title || formattedUrl;
            const shortLabel = label.length > 42 ? label.slice(0, 42) + '…' : label;
            await copyTextToSystemClipboard(formattedUrl, `🔗 Copied link for "${escapeHtml(shortLabel)}"`);
        }

        // =========================================================================
        // THEME MANAGEMENT (Light / Dark Mode)
        // =========================================================================
        function applyTheme(theme) {
            currentTheme = theme === 'light' ? 'light' : 'dark';
            if (currentTheme === 'dark') {
                document.documentElement.classList.add('dark');
                themeToggleBtn.title = 'Switch to Light Mode';
                // Sun icon when in dark mode
                themeToggleIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>`;
            } else {
                document.documentElement.classList.remove('dark');
                themeToggleBtn.title = 'Switch to Dark Mode';
                // Moon icon when in light mode
                themeToggleIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>`;
            }
            try {
                localStorage.setItem(STORAGE_KEYS.THEME, currentTheme);
            } catch (e) {}
        }

        function toggleTheme() {
            applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
        }

        // =========================================================================
        // RECENT & STARRED HISTORY BAR
        // =========================================================================
        function loadHistory() {
            try {
                const raw = localStorage.getItem(STORAGE_KEYS.HISTORY);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) {
                    return parsed.filter(item => item && typeof item.link === 'string');
                }
            } catch (e) {}
            return [];
        }

        function saveHistory() {
            try {
                localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(historyItems));
            } catch (e) {}
        }

        function getSortedHistory() {
            return [...historyItems].sort((a, b) => {
                if (Boolean(a.starred) !== Boolean(b.starred)) {
                    return a.starred ? -1 : 1;
                }
                return (b.timestamp || 0) - (a.timestamp || 0);
            });
        }

        function recordHistory(url, title = '', tag = '') {
            if (!url) return;
            const formatted = formatUrl(url);
            const existingIndex = historyItems.findIndex(item => item.link === formatted);
            let starred = false;
            let resolvedTitle = title;
            let resolvedTag = tag;

            if (existingIndex !== -1) {
                starred = Boolean(historyItems[existingIndex].starred);
                resolvedTitle = resolvedTitle || historyItems[existingIndex].title;
                resolvedTag = resolvedTag || historyItems[existingIndex].tag;
                historyItems.splice(existingIndex, 1);
            }

            historyItems.unshift({
                link: formatted,
                title: resolvedTitle || formatted.replace(/^https?:\/\//i, ''),
                tag: resolvedTag || '',
                starred: starred,
                timestamp: Date.now()
            });

            // Keep all starred items plus the newest unstarred items
            const starredItems = historyItems.filter(i => i.starred);
            const unstarredItems = historyItems.filter(i => !i.starred).slice(0, Math.max(5, 10 - starredItems.length));
            historyItems = [...starredItems, ...unstarredItems];

            saveHistory();
            if (!isFocusMode) {
                renderHistoryBar();
            }
        }

        function toggleStarHistoryItem(link) {
            const target = historyItems.find(item => item.link === link);
            if (!target) return;
            target.starred = !target.starred;
            target.timestamp = Date.now();
            saveHistory();
            renderHistoryBar();
            showToast(target.starred ? `★ Starred "${escapeHtml(target.title)}"` : `Unstarred "${escapeHtml(target.title)}"`);
        }

        function removeHistoryItem(link) {
            historyItems = historyItems.filter(item => item.link !== link);
            saveHistory();
            renderHistoryBar();
        }

        function closeHistoryPopover() {
            historyMenuPopover.classList.add('hidden');
            activePopoverLink = null;
        }

        function openHistoryPopover(item, anchorBtn) {
            activePopoverLink = item.link;
            popoverStarLabel.textContent = item.starred ? 'Unstar' : 'Star to front';
            popoverStarIcon.textContent = item.starred ? '☆' : '★';

            historyMenuPopover.classList.remove('hidden');

            const rect = anchorBtn.getBoundingClientRect();
            const popoverWidth = historyMenuPopover.offsetWidth || 176;
            const popoverHeight = historyMenuPopover.offsetHeight || 96;

            let left = rect.right - popoverWidth;
            let top = rect.bottom + 6;

            // Keep popover within viewport bounds on mobile and desktop
            if (left < 8) left = 8;
            if (left + popoverWidth > window.innerWidth - 8) {
                left = window.innerWidth - popoverWidth - 8;
            }
            if (top + popoverHeight > window.innerHeight - 8) {
                top = Math.max(8, rect.top - popoverHeight - 6);
            }

            historyMenuPopover.style.left = `${left}px`;
            historyMenuPopover.style.top = `${top}px`;
        }

        function renderHistoryBar() {
            const displayItems = getSortedHistory().slice(0, 5);
            historyBar.innerHTML = '';

            if (displayItems.length === 0) {
                historySection.classList.add('hidden');
                return;
            }

            historySection.classList.remove('hidden');

            displayItems.forEach(item => {
                const box = document.createElement('div');
                box.className = `group shrink-0 flex items-center gap-1.5 pl-3 pr-1.5 py-1.5 rounded-xl border text-xs transition-all cursor-pointer max-w-[210px] ${
                    item.starred
                        ? 'bg-amber-50/90 dark:bg-amber-500/10 border-amber-300/80 dark:border-amber-500/35 text-slate-800 dark:text-amber-100 hover:border-amber-400 dark:hover:border-amber-400/60'
                        : 'bg-white/90 dark:bg-slate-900/80 border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 hover:border-indigo-400/60 dark:hover:border-slate-700'
                }`;

                const starHtml = item.starred
                    ? '<span class="text-amber-500 dark:text-amber-400 text-xs shrink-0">★</span>'
                    : '';

                box.innerHTML = `
                    ${starHtml}
                    <span class="font-medium truncate">${escapeHtml(item.title)}</span>
                    <button
                        type="button"
                        aria-label="History item options"
                        class="history-dots-btn min-w-[26px] min-h-[26px] p-1 rounded-lg text-slate-400 hover:text-slate-800 dark:hover:text-white hover:bg-slate-200/70 dark:hover:bg-slate-800 transition-colors flex items-center justify-center shrink-0"
                    >
                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10 6a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm0 5.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm0 5.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/>
                        </svg>
                    </button>
                `;

                const dotsBtn = box.querySelector('.history-dots-btn');
                dotsBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!historyMenuPopover.classList.contains('hidden') && activePopoverLink === item.link) {
                        closeHistoryPopover();
                    } else {
                        openHistoryPopover(item, dotsBtn);
                    }
                });

                // Clicking the box re-opens the link (or copies it when Copy Link Mode is active)
                box.addEventListener('click', () => {
                    closeHistoryPopover();
                    if (isCopyLinkMode) {
                        copyItemLink(item.link, { title: item.title, tag: item.tag });
                    } else {
                        openLink(item.link, { title: item.title, tag: item.tag });
                    }
                });

                historyBar.appendChild(box);
            });
        }

        // =========================================================================
        // LINK OPENING, SAVE DATA PARSING & TREE BUILDING
        // =========================================================================
        function openLink(url, meta = null) {
            if (!url) return;
            const formattedUrl = formatUrl(url);
            const matchedItem = meta || flatItems.find(i => formatUrl(i.link) === formattedUrl);
            const title = matchedItem ? matchedItem.title : '';
            const tag = matchedItem ? matchedItem.tag : '';

            // Always store the clicked item in History and the App Clipboard
            recordHistory(formattedUrl, title, tag);
            setAppClipboard(formattedUrl, title);

            // Launch custom app protocols cleanly without leaving a blank tab
            if (/^(vscode|mailto|tel):/i.test(formattedUrl)) {
                const tempLink = document.createElement('a');
                tempLink.href = formattedUrl;
                tempLink.style.display = 'none';
                document.body.appendChild(tempLink);
                tempLink.click();
                document.body.removeChild(tempLink);
            } else {
                window.open(formattedUrl, '_blank', 'noopener,noreferrer');
            }

            // Always clear the search bar when opening a link (Focus & Expanded views)
            searchInput.value = '';
            justOpenedFolderByEnter = false;
            render();
        }

        function parseSaveData(rawText) {
            const lines = (rawText || '').split('\n');
            const items = [];

            lines.forEach((line, index) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                const regex = /^(?:\((\d+)\))?\s*\{?\s*"([^"]*)"\s*,\s*"([^"]*)"\s*,\s*"([^"]*)"\s*,\s*"([^"]*)"\s*\}?/;
                const match = trimmed.match(regex);

                if (match) {
                    const depth = match[1] !== undefined ? parseInt(match[1], 10) : 0;
                    items.push({
                        id: index,
                        depth: depth,
                        title: match[2],
                        description: match[3],
                        tag: match[4],
                        link: match[5],
                        children: [],
                        parent: null,
                        path: []
                    });
                }
            });

            return buildTree(items);
        }

        function buildTree(items) {
            const roots = [];
            const stack = [];

            items.forEach(item => {
                const depth = item.depth;

                while (stack.length > depth) {
                    stack.pop();
                }

                if (depth === 0 || stack.length === 0) {
                    item.parent = null;
                    item.path = [item.title];
                    roots.push(item);
                } else {
                    const parent = stack[stack.length - 1];
                    item.parent = parent;
                    item.path = [...parent.path, item.title];
                    parent.children.push(item);
                }

                stack[depth] = item;
            });

            return { roots, items };
        }

        // =========================================================================
        // SEARCH SCORING & CONTEXT HELPERS
        // =========================================================================
        function calculateSearchScore(item, query) {
            const q = query.toLowerCase().trim();
            if (!q) return 0;

            const tag = (item.tag || '').toLowerCase();
            const title = (item.title || '').toLowerCase();
            const desc = (item.description || '').toLowerCase();

            if (tag === q) return 1000;
            if (tag.startsWith(q)) return 900 - Math.min(80, tag.length - q.length);
            if (tag.includes(q)) return 800;

            if (title === q) return 500;
            if (title.startsWith(q)) return 400 - Math.min(80, title.length - q.length);
            if (title.includes(q)) return 300;

            if (desc.includes(q)) return 100;

            return 0;
        }

        function getContextItems() {
            if (isFocusMode) {
                return flatItems.filter(item => item.link && item.link.trim().length > 0);
            }
            if (currentPath.length === 0) {
                return flatItems;
            }
            const currentFolder = currentPath[currentPath.length - 1];
            const descendants = [];

            function collect(node) {
                node.children.forEach(child => {
                    descendants.push(child);
                    collect(child);
                });
            }
            collect(currentFolder);
            return descendants;
        }

        function getFirstLinkInFolder(folderNode) {
            if (folderNode.link && folderNode.link.trim().length > 0) {
                return folderNode.link;
            }
            for (const child of folderNode.children) {
                const found = getFirstLinkInFolder(child);
                if (found) return found;
            }
            return null;
        }

        function findBestLinkMatch(query) {
            const q = (query || '').trim().toLowerCase();
            if (!q) return null;

            const candidates = flatItems.filter(item => item.link && item.link.trim().length > 0);
            const scored = candidates
                .map(item => ({ item, score: calculateSearchScore(item, q) }))
                .filter(entry => entry.score > 0);

            if (scored.length === 0) return null;
            scored.sort((a, b) => b.score - a.score);
            return scored[0].item;
        }

                themeToggleBtn.classList.add('hidden');

                modeToggleBtn.classList.add('text-slate-500', 'dark:text-slate-400');
                modeToggleIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25"/>`;

                copyLinkModeBtn.classList.remove('hidden');

        function updateMatchBadge(query) {
            // Hide Enter badge in Focus Mode and at Root level; only show inside folders
            if (isFocusMode || currentPath.length === 0) {
                matchBadge.classList.add('hidden');
                matchBadge.classList.remove('md:inline-flex');
                return;
            }

            if (query.length === 0) {
                const currentFolder = currentPath[currentPath.length - 1];
                const folderLink = currentFolder.link || getFirstLinkInFolder(currentFolder);
                if (folderLink) {
                    matchBadge.textContent = isCopyLinkMode
                        ? `↵ Copy "${currentFolder.title}"`
                        : `↵ Open "${currentFolder.title}"`;
                    matchBadge.classList.remove('hidden');
                    matchBadge.classList.add('md:inline-flex');
                } else {
                    matchBadge.classList.add('hidden');
                    matchBadge.classList.remove('md:inline-flex');
                }
                return;
            }

            if (activeFilteredResults.length === 0) {
                matchBadge.classList.add('hidden');
                matchBadge.classList.remove('md:inline-flex');
                return;
            }

            const topMatch = activeFilteredResults[0];
            const isFolder = topMatch.children && topMatch.children.length > 0;
            if (isFolder) {
                matchBadge.textContent = `↵ Folder "${topMatch.title}"`;
            } else {
                matchBadge.textContent = isCopyLinkMode
                    ? `↵ Copy "${topMatch.title}"`
                    : `↵ Launch "${topMatch.title}"`;
            }
            matchBadge.classList.remove('hidden');
            matchBadge.classList.add('md:inline-flex');
        }

        function render() {
            const rawQuery = searchInput.value;
            const query = rawQuery.trim().toLowerCase();

            // Toggle Clear button visibility
            if (rawQuery.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }

            updateModeToggleVisuals();

            if (isFocusMode) {
                // Keep search bar + results centered vertically & horizontally
                mainWrapper.className = 'relative z-10 w-full mx-auto px-4 sm:px-6 py-5 sm:py-8 flex-1 flex flex-col justify-center transition-all duration-200 max-w-2xl';
                historySection.classList.add('hidden');
                workspaceSection.classList.add('hidden');
                closeHistoryPopover();

                if (query.length > 0) {
                    renderFocusSearchResults(query);
                } else {
                    focusResultsDropdown.classList.add('hidden');
                    focusResultsDropdown.innerHTML = '';
                    activeFilteredResults = [];
                }
            } else {
                mainWrapper.className = 'relative z-10 w-full mx-auto px-4 sm:px-6 py-5 sm:py-8 flex-1 flex flex-col transition-all duration-200 max-w-6xl';
                focusResultsDropdown.classList.add('hidden');
                workspaceSection.classList.remove('hidden');
                renderHistoryBar();

                if (query.length > 0) {
                    renderWorkspaceSearchResults(query);
                } else {
                    renderFolderView();
                }

                renderBreadcrumbs();
            }

            updateMatchBadge(query);
        }

        function renderFocusSearchResults(query) {
            const contextPool = getContextItems();
            const scored = contextPool
                .map(item => ({ item, score: calculateSearchScore(item, query) }))
                .filter(entry => entry.score > 0);

            scored.sort((a, b) => b.score - a.score);
            // Show ALL matching results so the user can scroll through everything
            activeFilteredResults = scored.map(entry => entry.item);

            focusResultsDropdown.innerHTML = '';
            focusResultsDropdown.classList.remove('hidden');

            if (activeFilteredResults.length === 0) {
                focusResultsDropdown.innerHTML = `
                    <div class="py-5 px-3 text-center text-sm text-slate-500 dark:text-slate-400">
                        No matching links found
                    </div>
                `;
                return;
            }

            activeFilteredResults.forEach((item, index) => {
                const card = createCardElement(item, index === 0, true, true);
                focusResultsDropdown.appendChild(card);
            });
        }

        function renderWorkspaceSearchResults(query) {
            const contextPool = getContextItems();
            const scored = contextPool
                .map(item => ({ item, score: calculateSearchScore(item, query) }))
                .filter(entry => entry.score > 0);

            scored.sort((a, b) => b.score - a.score);
            activeFilteredResults = scored.map(entry => entry.item);

            buttonsGrid.innerHTML = '';

            if (activeFilteredResults.length === 0) {
                buttonsGrid.classList.add('hidden');
                noResults.classList.remove('hidden');
                return;
            }

            buttonsGrid.classList.remove('hidden');
            noResults.classList.add('hidden');

            activeFilteredResults.forEach((item, index) => {
                const card = createCardElement(item, index === 0, true, false);
                buttonsGrid.appendChild(card);
            });
        }

        function renderFolderView() {
            const currentLevelItems = currentPath.length === 0
                ? rootNodes
                : currentPath[currentPath.length - 1].children;

            activeFilteredResults = currentLevelItems;
            buttonsGrid.innerHTML = '';

            if (currentLevelItems.length === 0) {
                buttonsGrid.classList.add('hidden');
                noResults.classList.remove('hidden');
                return;
            }

            buttonsGrid.classList.remove('hidden');
            noResults.classList.add('hidden');

            currentLevelItems.forEach((item, index) => {
                const isTopMatch = index === 0 && justOpenedFolderByEnter;
                const card = createCardElement(item, isTopMatch, false, false);
                buttonsGrid.appendChild(card);
            });
        }

        function createCardElement(item, isTopMatch, isSearchMode, isFocusDropdown = false) {
            const hasChildren = !isFocusMode && item.children && item.children.length > 0;
            const hasLink = item.link && item.link.trim().length > 0;

            const btn = document.createElement('button');
            btn.type = 'button';

            const baseLayout = isFocusDropdown
                ? 'w-full text-left px-3.5 py-3 rounded-xl border transition-all duration-150 flex items-center justify-between gap-3 active:scale-[0.99]'
                : 'w-full text-left px-3.5 py-3 rounded-xl border transition-all duration-150 flex items-center justify-between gap-2.5 active:scale-[0.98]';

            let colorClasses = '';
            if (isTopMatch) {
                colorClasses = 'bg-indigo-50/90 dark:bg-indigo-950/70 border-indigo-400 dark:border-indigo-500/80 ring-2 ring-indigo-500/20 text-slate-900 dark:text-white shadow-sm';
            } else if (hasChildren) {
                colorClasses = 'bg-slate-50/90 dark:bg-slate-800/80 hover:bg-indigo-50/50 dark:hover:bg-slate-800 border-indigo-200 dark:border-indigo-500/35 hover:border-indigo-400 dark:hover:border-indigo-400/70 text-slate-800 dark:text-slate-100';
            } else {
                colorClasses = 'bg-white/90 dark:bg-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-800 border-slate-200 dark:border-slate-700/80 hover:border-slate-300 dark:hover:border-slate-600 text-slate-800 dark:text-slate-100';
            }

            btn.className = `group ${baseLayout} ${colorClasses}`;

            const iconSpan = hasChildren ? '📁' : (isCopyLinkMode ? '📋' : '🔗');
            const badgeHtml = hasChildren
                ? `<span class="text-[11px] font-mono px-2 py-0.5 rounded-lg bg-indigo-500/10 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 border border-indigo-500/20 shrink-0">${item.children.length}</span>`
                : (item.tag ? `<span class="text-[11px] font-mono px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-indigo-600 dark:text-indigo-400 shrink-0">${escapeHtml(item.tag)}</span>` : '');

            const pathHint = (isFocusDropdown && item.path && item.path.length > 1)
                ? `<span class="block text-[11px] text-slate-400 dark:text-slate-500 truncate">${escapeHtml(item.path.slice(0, -1).join(' / '))}</span>`
                : '';

            btn.innerHTML = `
                <div class="flex items-center gap-2.5 min-w-0 flex-1">
                    <span class="text-base shrink-0">${iconSpan}</span>
                    <div class="min-w-0 flex-1">
                        <span class="block font-medium text-sm sm:text-[15px] truncate group-hover:text-indigo-600 dark:group-hover:text-indigo-300 transition-colors">
                            ${escapeHtml(item.title)}
                        </span>
                        ${pathHint}
                    </div>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                    ${badgeHtml}
                </div>
            `;

            btn.addEventListener('click', () => {
                justOpenedFolderByEnter = false;
                if (hasChildren && !isSearchMode) {
                    currentPath.push(item);
                    render();
                } else if (hasChildren && isSearchMode) {
                    searchInput.value = '';
                    currentPath = [...getFolderPath(item), item];
                    render();
                } else if (hasLink) {
                    if (isCopyLinkMode) {
                        copyItemLink(item.link, item);
                    } else {
                        openLink(item.link, item);
                    }
                }
            });

            return btn;
        }

        function renderBreadcrumbs() {
            breadcrumbs.innerHTML = '';

            const rootBtn = document.createElement('button');
            rootBtn.type = 'button';
            rootBtn.className = `px-2.5 py-1 rounded-lg text-xs font-medium transition-colors flex items-center gap-1 shrink-0 ${
                currentPath.length === 0
                    ? 'bg-indigo-500/15 text-indigo-700 dark:text-indigo-300 border border-indigo-500/30'
                    : 'text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800'
            }`;
            rootBtn.innerHTML = '<span>🏠</span><span>Home</span>';
            rootBtn.addEventListener('click', () => {
                currentPath = [];
                justOpenedFolderByEnter = false;
                render();
            });
            breadcrumbs.appendChild(rootBtn);

            currentPath.forEach((node, index) => {
                const sep = document.createElement('span');
                sep.className = 'text-slate-400 dark:text-slate-600 text-xs shrink-0';
                sep.textContent = '/';
                breadcrumbs.appendChild(sep);

                const stepBtn = document.createElement('button');
                stepBtn.type = 'button';
                const isLast = index === currentPath.length - 1;
                stepBtn.className = `px-2.5 py-1 rounded-lg text-xs font-medium transition-colors truncate max-w-[140px] shrink-0 ${
                    isLast
                        ? 'bg-indigo-500/15 text-indigo-700 dark:text-indigo-300 border border-indigo-500/30'
                        : 'text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800'
                }`;
                stepBtn.textContent = node.title;
                stepBtn.addEventListener('click', () => {
                    currentPath = currentPath.slice(0, index + 1);
                    justOpenedFolderByEnter = false;
                    render();
                });
                breadcrumbs.appendChild(stepBtn);
            });
        }

        function handleEnterLaunch() {
            const query = searchInput.value.trim();

            // Inside a folder with an empty search box: open/copy folder's link
            if (!isFocusMode && currentPath.length > 0 && query.length === 0) {
                const currentFolder = currentPath[currentPath.length - 1];
                const folderLink = currentFolder.link || getFirstLinkInFolder(currentFolder);
                if (folderLink) {
                    if (isCopyLinkMode) {
                        copyItemLink(folderLink, currentFolder);
                    } else {
                        openLink(folderLink, currentFolder);
                    }
                    return;
                }
            }

            if (activeFilteredResults.length > 0) {
                const topMatch = activeFilteredResults[0];
                const isFolder = !isFocusMode && topMatch.children && topMatch.children.length > 0;

                if (isFolder) {
                    currentPath.push(topMatch);
                    searchInput.value = '';
                    justOpenedFolderByEnter = true;
                    render();
                } else if (topMatch.link) {
                    if (isCopyLinkMode) {
                        copyItemLink(topMatch.link, topMatch);
                    } else {
                        openLink(topMatch.link, topMatch);
                    }
                }
            }
        }

        // =========================================================================
        // SAVE DATA PERSISTENCE, UNDO / REDO, COPY & PASTE
        // =========================================================================
        let saveIndicatorTimer = null;

        function persistSaveData(rawData, showSavedBadge = true) {
            try {
                localStorage.setItem(STORAGE_KEYS.DATA, rawData);
            } catch (e) {}

            const parsed = parseSaveData(rawData);
            rootNodes = parsed.roots;
            flatItems = parsed.items;

            // Keep currentPath valid if folders were edited or removed
            if (currentPath.length > 0) {
                const titles = currentPath.map(n => n.title);
                const rebuiltPath = [];
                let searchLevel = rootNodes;
                for (const title of titles) {
                    const found = searchLevel.find(n => n.title === title);
                    if (!found) break;
                    rebuiltPath.push(found);
                    searchLevel = found.children || [];
                }
                currentPath = rebuiltPath;
            }

            render();

            if (showSavedBadge) {
                statusIndicator.classList.remove('opacity-0');
                clearTimeout(saveIndicatorTimer);
                saveIndicatorTimer = setTimeout(() => {
                    statusIndicator.classList.add('opacity-0');
                }, 1400);
            }
        }

        function updateUndoRedoButtons() {
            const canUndo = undoStack.length > 1;
            const canRedo = redoStack.length > 0;

            undoDataBtn.disabled = !canUndo;
            redoDataBtn.disabled = !canRedo;

            undoDataBtn.classList.toggle('opacity-40', !canUndo);
            undoDataBtn.classList.toggle('cursor-not-allowed', !canUndo);
            redoDataBtn.classList.toggle('opacity-40', !canRedo);
            redoDataBtn.classList.toggle('cursor-not-allowed', !canRedo);
        }

        function pushUndoSnapshot(value) {
            if (undoStack.length === 0 || undoStack[undoStack.length - 1] !== value) {
                undoStack.push(value);
                if (undoStack.length > 100) {
                    undoStack.shift();
                }
                redoStack = [];
                updateUndoRedoButtons();
            }
        }

        function undoSaveData() {
            clearTimeout(undoDebounceTimer);
            // Capture any unsaved pending edit before undoing
            if (undoStack.length > 0 && undoStack[undoStack.length - 1] !== dataInput.value) {
                undoStack.push(dataInput.value);
            }
            if (undoStack.length <= 1) return;

            const current = undoStack.pop();
            redoStack.push(current);
            const previous = undoStack[undoStack.length - 1];

            dataInput.value = previous;
            persistSaveData(previous, true);
            updateUndoRedoButtons();
        }

        function redoSaveData() {
            clearTimeout(undoDebounceTimer);
            if (redoStack.length === 0) return;

            const nextVal = redoStack.pop();
            undoStack.push(nextVal);

            dataInput.value = nextVal;
            persistSaveData(nextVal, true);
            updateUndoRedoButtons();
        }

        async function copySaveData() {
            const ok = await copyTextToSystemClipboard(dataInput.value, '📋 Save Data copied to clipboard');
            if (ok) {
                copyBtnLabel.textContent = 'Copied!';
                setTimeout(() => {
                    copyBtnLabel.textContent = 'Copy';
                }, 1300);
            }
        }

        async function pasteSaveData() {
            if (!navigator.clipboard || !navigator.clipboard.readText) {
                showToast('Clipboard paste blocked here — tap inside Save Data and press Ctrl/Cmd+V.', 3200);
                dataInput.focus();
                return;
            }
            try {
                const text = await navigator.clipboard.readText();
                if (typeof text === 'string') {
                    clearTimeout(undoDebounceTimer);
                    pushUndoSnapshot(dataInput.value);
                    dataInput.value = text;
                    pushUndoSnapshot(text);
                    persistSaveData(text, true);

                    pasteBtnLabel.textContent = 'Pasted!';
                    setTimeout(() => {
                        pasteBtnLabel.textContent = 'Paste';
                    }, 1300);
                    showToast('📋 Pasted into Save Data');
                }
            } catch (e) {
                showToast('Browser blocked automatic paste — tap Save Data and paste manually.', 3200);
                dataInput.focus();
            }
        }

        // =========================================================================
        // DICTATION MODE (Desktop & Mobile Fixes + Voice Commands)
        // =========================================================================
        const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

        async function refreshMicPermissionState() {
            if (!navigator.permissions || !navigator.permissions.query) {
                return micPermissionState;
            }
            try {
                const status = await navigator.permissions.query({ name: 'microphone' });
                micPermissionState = status.state; // 'granted', 'prompt', 'denied'
                status.onchange = () => {
                    micPermissionState = status.state;
                };
            } catch (e) {}
            return micPermissionState;
        }

        function updateDictationUI(state = 'off', statusMsg = '') {
            if (!isDictationOn || state === 'off') {
                document.title = 'Quick Launcher';
