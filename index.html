        // Configuration for continuous "... Start" / "... Stop" hold modes
        const HOLD_CONFIGS = {
            copy: {
                label: 'Copy',
                stopLabel: 'Copy Stop',
                stopRegex: /\bcopy[\s,.;:!?-]+stop\b/i
            },
            search: {
                label: 'Google Search',
                stopLabel: 'Search Stop',
                stopRegex: /\b(?:google[\s,.;:!?-]+)?search[\s,.;:!?-]+stop\b/i
            },
            youtube_search: {
                label: 'YouTube Search',
                stopLabel: 'YouTube Search Stop',
                stopRegex: /\byoutube[\s,.;:!?-]+search[\s,.;:!?-]+stop\b/i
            },
            gpt_search: {
                label: 'ChatGPT Search',
                stopLabel: 'GPT Search Stop',
                stopRegex: /\b(?:chat[\s,.;:!?-]*)?g[\s.]*p[\s.]*t[\s,.;:!?-]+search[\s,.;:!?-]+stop\b/i
            }
        };

        // Ordered voice command definitions (most specific first for tie-breaking at equal positions)
        const DICTATION_COMMANDS = [
            { type: 'hold_start', mode: 'youtube_search', regex: /\byoutube[\s,.;:!?-]+search[\s,.;:!?-]+start\b/i },
            { type: 'hold_start', mode: 'gpt_search', regex: /\b(?:chat[\s,.;:!?-]*)?g[\s.]*p[\s.]*t[\s,.;:!?-]+search[\s,.;:!?-]+start\b/i },
            { type: 'hold_start', mode: 'search', regex: /\b(?:google[\s,.;:!?-]+)?search[\s,.;:!?-]+start\b/i },
            { type: 'hold_start', mode: 'copy', regex: /\bcopy[\s,.;:!?-]+start\b/i },
            { type: 'copy_copy', regex: /\bcopy[\s,.;:!?-]+copy\b/i },
            { type: 'copy', regex: /\bcopy\b/i },
            { type: 'youtube_search', regex: /\byoutube[\s,.;:!?-]+search\b/i },
            { type: 'gpt_search', regex: /\b(?:chat[\s,.;:!?-]*)?g[\s.]*p[\s.]*t[\s,.;:!?-]+search\b/i },
            { type: 'search', regex: /\b(?:google[\s,.;:!?-]+)?search\b/i },
            { type: 'open', regex: /\b(?:open|navigation|go[\s,.;:!?-]+to)\b/i }
        ];

        function clearDictationWait() {
            dictationWaitingMode = null;
            clearTimeout(dictationWaitTimeout);
            dictationWaitTimeout = null;
        }

        function clearDictationHold() {
            dictationHoldMode = null;
            dictationHoldBuffer = [];
        }

        function setDictationWaiting(mode) {
            clearDictationWait();
            dictationWaitingMode = mode;
            const labels = {
                open: 'Heard trigger — say what to open...',
                copy: 'Heard "Copy" — say what to copy...',
                copy_copy: 'Heard "Copy Copy" — say what to copy...',
                search: 'Heard "Search" — say what to search on Google...',
                youtube_search: 'Heard "YouTube Search" — say what to search on YouTube...',
                gpt_search: 'Heard "GPT Search" — say what to ask ChatGPT...'
            };
            updateDictationUI('listening', labels[mode] || 'Listening for command...');

            dictationWaitTimeout = setTimeout(() => {
                if (dictationWaitingMode === 'copy_copy') {
                    // User said just "copy copy" with nothing after
                    copyFromAppClipboard('🎙️');
                }
                clearDictationWait();
                if (isDictationOn && isRecognitionRunning) {
                    updateDictationUI(dictationHoldMode ? 'holding' : 'listening');
                }
            }, 4000);
        }

        function startDictationHold(mode, initialChunk = '') {
            clearDictationWait();
            dictationHoldMode = mode;
            dictationHoldBuffer = [];
            const cfg = HOLD_CONFIGS[mode];
            dictationTranscript.textContent = '';
            updateDictationUI('holding');
            showToast(`🔴 Recording ${cfg.label} — say "${cfg.stopLabel}" when done`, 2800);

            if (initialChunk) {
                appendDictationHoldChunk(initialChunk);
            }
        }

        function appendDictationHoldChunk(chunk) {
            if (!dictationHoldMode) return;
            const cfg = HOLD_CONFIGS[dictationHoldMode];
            const stopMatch = chunk.match(cfg.stopRegex);

            if (stopMatch) {
                const beforeStop = chunk.slice(0, stopMatch.index).replace(/[\s,.;:!?-]+$/, '').trim();
                if (beforeStop) {
                    dictationHoldBuffer.push(beforeStop);
                }
                finishDictationHold();
                return;
            }

            const cleanedChunk = chunk.trim();
            if (cleanedChunk) {
                dictationHoldBuffer.push(cleanedChunk);
                const preview = dictationHoldBuffer.join(' ');
                dictationTranscript.textContent = `"${preview}"`;
            }
            updateDictationUI('holding');
        }

        async function finishDictationHold() {
            if (!dictationHoldMode) return;
            const mode = dictationHoldMode;
            const cfg = HOLD_CONFIGS[mode];
            const combined = dictationHoldBuffer.join(' ').trim();

            clearDictationHold();
            dictationTranscript.textContent = combined ? `"${combined}"` : '';

            if (isDictationOn && isRecognitionRunning) {
                updateDictationUI('listening');
            }

            if (!combined) {
                showToast(`🎙️ Stopped ${cfg.label} (nothing captured)`);
                return;
            }

            if (mode === 'copy') {
                await executeDictationCopy(combined, true, true);
            } else {
                executeDictationSearch(mode, combined);
            }
        }

        function executeDictationOpen(query) {
            const cleaned = (query || '').trim();
            if (!cleaned) return;

            const match = findBestLinkMatch(cleaned);
            if (!match) {
                showToast(`🎙️ No match for "${escapeHtml(cleaned)}"`);
                return;
            }

            if (isCopyLinkMode) {
                copyItemLink(match.link, match);
            } else {
                showToast(`🎙️ Opening "${escapeHtml(match.title)}"`);
                openLink(match.link, match);
            }
        }

        function executeDictationSearch(engine, query) {
            const cleaned = (query || '').trim();
            if (!cleaned) return;

            let url = '';
            let label = '';
            let tag = 'search';

            if (engine === 'youtube_search') {
                url = `https://www.youtube.com/results?search_query=${encodeURIComponent(cleaned)}`;
                label = `YouTube: ${cleaned}`;
                tag = 'youtube';
            } else if (engine === 'gpt_search') {
                url = `https://chatgpt.com/?q=${encodeURIComponent(cleaned)}`;
                label = `ChatGPT: ${cleaned}`;
                tag = 'gpt';
            } else {
                url = `https://www.google.com/search?q=${encodeURIComponent(cleaned)}`;
                label = `Google: ${cleaned}`;
                tag = 'search';
            }

            const shortLabel = label.length > 46 ? label.slice(0, 46) + '…' : label;
            showToast(`🎙️ Searching ${escapeHtml(shortLabel)}`);
            openLink(url, { title: label, tag });
        }

        async function executeDictationCopy(query, alsoCopyToSystem = true, preferRawText = false) {
            const cleaned = (query || '').trim();
            if (!cleaned) {
                if (alsoCopyToSystem) {
                    await copyFromAppClipboard('🎙️');
                }
                return;
            }

            const match = preferRawText ? null : findBestLinkMatch(cleaned);
            let valueToStore = cleaned;
            let titleToStore = '';

            if (match && match.link) {
                valueToStore = formatUrl(match.link);
                titleToStore = match.title;
            }

            setAppClipboard(valueToStore, titleToStore);

            if (alsoCopyToSystem) {
                await copyFromAppClipboard('🎙️');
            } else {
                const label = titleToStore || valueToStore;
                const shortLabel = label.length > 40 ? label.slice(0, 40) + '…' : label;
                showToast(`🎙️ Added "${escapeHtml(shortLabel)}" to App Clipboard`);
            }
        }

        function findEarliestDictationCommand(rawText) {
            let best = null;
            for (const cmd of DICTATION_COMMANDS) {
                const match = rawText.match(cmd.regex);
                if (!match) continue;
                // Earliest starting index wins; DICTATION_COMMANDS ordering breaks ties in favor of longer/more specific triggers
                if (!best || match.index < best.index) {
                    best = {
                        cmd,
                        index: match.index,
                        endIndex: match.index + match[0].length
                    };
                }
            }
            return best;
        }

        function processDictationTranscript(rawTranscript) {
            const cleaned = (rawTranscript || '').trim();
            if (!cleaned) return;

            const normalized = cleaned.toLowerCase().replace(/[.,!?;:]+/g, ' ').replace(/\s+/g, ' ').trim();
            if (!normalized) return;

            // Prevent duplicate firing from overlapping interim/final mobile results
            const now = Date.now();
            if (normalized === lastProcessedTranscript && (now - lastProcessedTime) < 1400) {
                return;
            }
            lastProcessedTranscript = normalized;
            lastProcessedTime = now;

            // If currently holding/recording for a "... Start" command, buffer until matching "... Stop"
            if (dictationHoldMode) {
                appendDictationHoldChunk(cleaned);
                return;
            }

            dictationTranscript.textContent = `"${cleaned}"`;

            // If we were waiting for the second half of a spoken command
            if (dictationWaitingMode) {
                const mode = dictationWaitingMode;
                clearDictationWait();
                if (mode === 'open') {
                    executeDictationOpen(cleaned);
                } else if (mode === 'copy' || mode === 'copy_copy') {
                    executeDictationCopy(cleaned, true, false);
                } else if (mode === 'search' || mode === 'youtube_search' || mode === 'gpt_search') {
                    executeDictationSearch(mode, cleaned);
                }
                if (isDictationOn && isRecognitionRunning) {
                    updateDictationUI(dictationHoldMode ? 'holding' : 'listening');
                }
                return;
            }

            // Detect the earliest spoken voice command in the utterance
            const found = findEarliestDictationCommand(cleaned);
            if (!found) return;

            const remainder = cleaned.slice(found.endIndex).replace(/^[\s,.;:!?-]+/, '').trim();
            const remainderHasContent = remainder.replace(/[.,!?;:\s]+/g, '').length > 0;
            const { type, mode } = found.cmd;

            if (type === 'hold_start') {
                startDictationHold(mode, remainderHasContent ? remainder : '');
                return;
            }

            if (type === 'copy_copy') {
                if (remainderHasContent) {
                    executeDictationCopy(remainder, true, false);
                } else {
                    copyFromAppClipboard('🎙️');
                }
                return;
            }

            if (type === 'copy') {
                if (remainderHasContent) {
                    // Saying "copy" once automatically adds to App Clipboard AND copies to system clipboard
                    executeDictationCopy(remainder, true, false);
                } else {
                    setDictationWaiting('copy');
                }
                return;
            }

            if (type === 'search' || type === 'youtube_search' || type === 'gpt_search') {
                if (remainderHasContent) {
                    executeDictationSearch(type, remainder);
                } else {
                    setDictationWaiting(type);
                }
                return;
            }

            if (type === 'open') {
                if (remainderHasContent) {
                    executeDictationOpen(remainder);
                } else {
                    setDictationWaiting('open');
                }
            }
        }

        function canAutoRestartSafely() {
            if (!isDictationOn) return false;
            if (micPermissionState === 'denied') return false;
            if (pausedForBackgroundBlock) return false;
            if (repromptDetected) return false;
            return true;
        }

        // Keeps a silent active mic capture on desktop HTTPS/localhost so browsers do not freeze/throttle this tab in the background
        async function ensureKeepAliveMicStream() {
            if (keepAliveStream || keepAliveDisabledByAudioConflict) return;
            if (isMobileDevice || isFileProtocol) return;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

            await refreshMicPermissionState();
            if (micPermissionState !== 'granted') return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                if (!isDictationOn) {
                    stream.getTracks().forEach(t => t.stop());
                    return;
                }
                keepAliveStream = stream;
            } catch (e) {
                keepAliveDisabledByAudioConflict = true;
            }
        }

        function stopKeepAliveMicStream() {
            if (keepAliveStream) {
                try {
                    keepAliveStream.getTracks().forEach(track => track.stop());
                } catch (e) {}
                keepAliveStream = null;
            }
        }

        // Background-resistant Web Worker heartbeat to revive SpeechRecognition if the browser silently ends it
        function startDictationWatchdog() {
            if (dictationWatchdogWorker || dictationWatchdogInterval) return;

            const handleWatchdogTick = () => {
                if (
                    isDictationOn &&
                    !isRecognitionRunning &&
                    !isStartingRecognition &&
                    !dictationRestartTimeout &&
                    canAutoRestartSafely()
                ) {
                    startDictation(false);
                }
            };

            try {
                const workerCode = `setInterval(() => postMessage('tick'), 2500);`;
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                const workerUrl = URL.createObjectURL(blob);
                dictationWatchdogWorker = new Worker(workerUrl);
                URL.revokeObjectURL(workerUrl);
                dictationWatchdogWorker.onmessage = handleWatchdogTick;
            } catch (e) {
                dictationWatchdogWorker = null;
                dictationWatchdogInterval = setInterval(handleWatchdogTick, 2500);
            }
        }

        function stopDictationWatchdog() {
            if (dictationWatchdogWorker) {
                try {
                    dictationWatchdogWorker.terminate();
                } catch (e) {}
                dictationWatchdogWorker = null;
            }
            if (dictationWatchdogInterval) {
                clearInterval(dictationWatchdogInterval);
                dictationWatchdogInterval = null;
            }
        }

        function stopDictation(turnOffPreference = false) {
            clearTimeout(dictationRestartTimeout);
            dictationRestartTimeout = null;
            clearTimeout(mobileInterimTimer);
            clearDictationWait();

            if (turnOffPreference) {
                isDictationOn = false;
                clearDictationHold();
                stopDictationWatchdog();
                stopKeepAliveMicStream();
                try {
                    localStorage.setItem(STORAGE_KEYS.DICTATION, 'false');
                } catch (e) {}
            }

            isStartingRecognition = false;
            isRecognitionRunning = false;

            if (speechRecognition) {
                try {
                    speechRecognition.onstart = null;
                    speechRecognition.onresult = null;
                    speechRecognition.onerror = null;
                    speechRecognition.onend = null;
                    speechRecognition.abort();
                } catch (e) {}
                speechRecognition = null;
            }

            if (turnOffPreference) {
                dictationPausedToAvoidPrompt = false;
                pausedForVisibility = false;
                pausedForBackgroundBlock = false;
                consecutiveStartFailures = 0;
                updateDictationUI('off');
            }
        }

        async function startDictation(isManualTrigger = false) {
            if (!SpeechRecognitionAPI) {
                showToast('🎙️ Speech Recognition is not supported in this browser (use Safari on iOS or Chrome/Edge).', 4000);
                stopDictation(true);
                return;
            }

            if (isRecognitionRunning || isStartingRecognition) return;

            await refreshMicPermissionState();

            // On reload, avoid auto-prompting if browser has not persisted permission
            if (!isManualTrigger && !hasStartedOnceThisSession && micPermissionState !== 'granted') {
                dictationPausedToAvoidPrompt = true;
                pendingGestureResume = true;
                updateDictationUI('paused', 'Dictation ready — tap Resume Mic to start');
                return;
            }

            if (isManualTrigger) {
                pausedForBackgroundBlock = false;
                repromptDetected = false;
                consecutiveStartFailures = 0;
            }

            startDictationWatchdog();

            // Dismiss mobile virtual keyboard so iOS/Android microphone audio session activates cleanly
            if (isMobileDevice && document.activeElement === searchInput) {
                searchInput.blur();
            }

            clearTimeout(dictationRestartTimeout);
            dictationRestartTimeout = null;
            clearTimeout(mobileInterimTimer);
            pendingMobileInterim = '';
            finalHandledInSession = false;

            const recognition = new SpeechRecognitionAPI();
            // Mobile Chrome/Safari hang on continuous=true; use single-utterance sessions on mobile
            recognition.continuous = !isMobileDevice;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
            recognition.lang = navigator.language || 'en-US';

            isStartingRecognition = true;
            isAutoRestartAttempt = !isManualTrigger;
            recognitionStartAttemptTime = Date.now();
            speechRecognition = recognition;

            recognition.onstart = () => {
                isStartingRecognition = false;
                isRecognitionRunning = true;
                hasStartedOnceThisSession = true;
                dictationPausedToAvoidPrompt = false;
                pausedForVisibility = false;
                pausedForBackgroundBlock = false;
                consecutiveStartFailures = 0;

                // Only detect file:// re-prompts in the foreground so background throttling never causes false pauses
                const elapsed = Date.now() - recognitionStartAttemptTime;
                if (!document.hidden && isFileProtocol && isAutoRestartAttempt && elapsed > 1800 && micPermissionState !== 'granted') {
                    repromptDetected = true;
                }

                updateDictationUI(dictationHoldMode ? 'holding' : 'listening');
                ensureKeepAliveMicStream();
            };

            recognition.onresult = (event) => {
                let finalChunk = '';
                let interimChunk = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const res = event.results[i];
                    const transcript = res[0] ? res[0].transcript : '';
                    if (res.isFinal) {
                        finalChunk += ' ' + transcript;
                    } else {
                        interimChunk += ' ' + transcript;
                    }
                }

                if (interimChunk.trim()) {
                    if (dictationHoldMode && dictationHoldBuffer.length > 0) {
                        dictationTranscript.textContent = `"${dictationHoldBuffer.join(' ')} ${interimChunk.trim()}"`;
                    } else {
                        dictationTranscript.textContent = interimChunk.trim();
                    }
                }

                if (interimChunk.trim()) {
                    dictationTranscript.textContent = interimChunk.trim();
                }

                if (finalChunk.trim()) {
                    clearTimeout(mobileInterimTimer);
                    pendingMobileInterim = '';
                    finalHandledInSession = true;
                    processDictationTranscript(finalChunk.trim());
                } else if (isMobileDevice && interimChunk.trim()) {
                    // iOS Safari sometimes never marks results isFinal; settle after a brief pause
                    pendingMobileInterim = interimChunk.trim();
                    clearTimeout(mobileInterimTimer);
                    mobileInterimTimer = setTimeout(() => {
                        if (pendingMobileInterim && !finalHandledInSession) {
                            const toProcess = pendingMobileInterim;
                            pendingMobileInterim = '';
                            finalHandledInSession = true;
                            processDictationTranscript(toProcess);
                        }
                    }, 1150);
                }
            };

            recognition.onerror = (event) => {
                isStartingRecognition = false;
                const err = event.error;

                if (err === 'not-allowed' || err === 'service-not-allowed') {
                    // If the browser refused a restart solely because this tab is in the background, auto-resume on return
                    if (document.hidden && hasStartedOnceThisSession) {
                        pausedForBackgroundBlock = true;
                        updateDictationUI('paused', 'Browser paused mic in background — will auto-resume');
                        return;
                    }

                    micPermissionState = 'denied';
                    dictationPausedToAvoidPrompt = true;
                    stopKeepAliveMicStream();
                    updateDictationUI('error', isIOS
                        ? 'Mic blocked — enable Safari Mic & Keyboard Dictation in iOS Settings'
                        : 'Microphone permission denied — allow mic access and tap Resume Mic');
                    return;
                }

                if (err === 'audio-capture') {
                    // Release keep-alive stream if the OS audio driver disallows sharing the mic
                    if (keepAliveStream) {
                        keepAliveDisabledByAudioConflict = true;
                        stopKeepAliveMicStream();
                    }
                    consecutiveStartFailures++;
                    return;
                }

                if (err === 'network') {
                    consecutiveStartFailures++;
                    return;
                }

                if (err === 'no-speech' || err === 'aborted') {
                    // Handled gracefully in onend so listening continues uninterrupted
                    return;
                }
            };

            recognition.onend = () => {
                isStartingRecognition = false;
                isRecognitionRunning = false;

                // Flush unsettled mobile interim text when recognition stops
                if (isMobileDevice && pendingMobileInterim && !finalHandledInSession) {
                    clearTimeout(mobileInterimTimer);
                    const toProcess = pendingMobileInterim;
                    pendingMobileInterim = '';
                    finalHandledInSession = true;
                    processDictationTranscript(toProcess);
                }

                if (!isDictationOn) {
                    updateDictationUI('off');
                    return;
                }

                if (micPermissionState === 'denied' || pausedForBackgroundBlock) {
                    return;
                }

                if (canAutoRestartSafely()) {
                    const retryDelay = isMobileDevice
                        ? 350
                        : (consecutiveStartFailures > 0 ? Math.min(4000, 400 * consecutiveStartFailures) : 150);

                    dictationRestartTimeout = setTimeout(() => {
                        dictationRestartTimeout = null;
                        if (isDictationOn && !isRecognitionRunning && !isStartingRecognition && canAutoRestartSafely()) {
                            startDictation(false);
                        }
                    }, retryDelay);
                } else {
                    dictationPausedToAvoidPrompt = true;
                    updateDictationUI('paused', 'Paused to avoid repeat permission prompts');
                }
            };

            try {
                recognition.start();
            } catch (e) {
                isStartingRecognition = false;
                isRecognitionRunning = false;
                consecutiveStartFailures++;

                if (canAutoRestartSafely()) {
                    const retryDelay = Math.min(4000, 500 * consecutiveStartFailures);
                    dictationRestartTimeout = setTimeout(() => {
                        dictationRestartTimeout = null;
                        if (isDictationOn && !isRecognitionRunning && !isStartingRecognition && canAutoRestartSafely()) {
                            startDictation(false);
                        }
                    }, retryDelay);
                } else {
                    updateDictationUI('error', 'Could not start mic — tap Resume Mic');
                }
            }
        }

        function toggleDictation() {
            if (!SpeechRecognitionAPI) {
                showToast('🎙️ Voice dictation requires Chrome, Edge, or iOS Safari over HTTPS.', 3800);
                return;
            }

            if (isDictationOn) {
                stopDictation(true);
                showToast('🎙️ Dictation Mode OFF');
            } else {
                isDictationOn = true;
                repromptDetected = false;
                dictationPausedToAvoidPrompt = false;
                try {
                    localStorage.setItem(STORAGE_KEYS.DICTATION, 'true');
                } catch (e) {}
                startDictation(true);
            }
        }

        // =========================================================================
        // EVENT LISTENERS
        // =========================================================================
        function toggleFocusMode() {
            isFocusMode = !isFocusMode;
            try {
                localStorage.setItem(STORAGE_KEYS.FOCUS_MODE, isFocusMode ? 'true' : 'false');
            } catch (e) {}
            render();
            if (!isMobileDevice) {
                searchInput.focus();
            }
        }

        modeToggleBtn.addEventListener('click', toggleFocusMode);
        themeToggleBtn.addEventListener('click', toggleTheme);
        copyLinkModeBtn.addEventListener('click', toggleCopyLinkMode);
        copyModeIndicator.addEventListener('click', toggleCopyLinkMode);
        appClipboardBtn.addEventListener('click', () => copyFromAppClipboard('📋'));
        dictationBtn.addEventListener('click', toggleDictation);
        dictationFinishHoldBtn.addEventListener('click', finishDictationHold);
        dictationResumeBtn.addEventListener('click', () => {
            repromptDetected = false;
            dictationPausedToAvoidPrompt = false;
            pausedForBackgroundBlock = false;
            consecutiveStartFailures = 0;
            startDictation(true);
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            justOpenedFolderByEnter = false;
            render();
            searchInput.focus();
        });

        searchInput.addEventListener('input', () => {
            justOpenedFolderByEnter = false;
            render();
        });

        // History 3-dots Popover Controls
        popoverStarBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (activePopoverLink) {
                toggleStarHistoryItem(activePopoverLink);
            }
            closeHistoryPopover();
        });

        popoverRemoveBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (activePopoverLink) {
                removeHistoryItem(activePopoverLink);
            }
            closeHistoryPopover();
        });

        document.addEventListener('click', (e) => {
            if (!historyMenuPopover.classList.contains('hidden') && !historyMenuPopover.contains(e.target)) {
                closeHistoryPopover();
            }
        });

        window.addEventListener('resize', closeHistoryPopover);

        // Save Data Editor Events (Auto-save, Undo/Redo, Copy/Paste)
        dataInput.addEventListener('input', () => {
            const rawData = dataInput.value;
            persistSaveData(rawData, true);

            clearTimeout(undoDebounceTimer);
            undoDebounceTimer = setTimeout(() => {
                pushUndoSnapshot(dataInput.value);
            }, 350);
        });

        dataInput.addEventListener('change', () => {
            persistSaveData(dataInput.value, false);
            pushUndoSnapshot(dataInput.value);
        });

        dataInput.addEventListener('keydown', (e) => {
            const isMod = e.ctrlKey || e.metaKey;
            if (!isMod) return;

            const key = e.key.toLowerCase();
            if (key === 'z' && !e.shiftKey) {
                e.preventDefault();
                undoSaveData();
            } else if (key === 'y' || (key === 'z' && e.shiftKey)) {
                e.preventDefault();
                redoSaveData();
            }
        });

        undoDataBtn.addEventListener('click', undoSaveData);
        redoDataBtn.addEventListener('click', redoSaveData);
        copyDataBtn.addEventListener('click', copySaveData);
        pasteDataBtn.addEventListener('click', pasteSaveData);

        window.addEventListener('beforeunload', () => {
            stopDictationWatchdog();
            stopKeepAliveMicStream();
            try {
                localStorage.setItem(STORAGE_KEYS.DATA, dataInput.value);
            } catch (e) {}
        });

        // Global Keyboard Shortcuts (Tab to switch view, Global Enter to launch, Escape to close menus/clear)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (!historyMenuPopover.classList.contains('hidden')) {
                    closeHistoryPopover();
                    return;
                }
                if (searchInput.value.length > 0) {
                    searchInput.value = '';
                    render();
                }
                return;
            }

            if (e.key === 'Tab') {
                if (e.repeat) return;
                if (document.activeElement === dataInput) return;
                e.preventDefault();
                toggleFocusMode();
                return;
            }

            if (e.key === 'Enter') {
                // Allow normal newlines inside Save Data textarea
                if (document.activeElement === dataInput) return;
                // Allow focused interactive buttons to activate normally
                if (document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement !== searchInput) {
                    return;
                }
                e.preventDefault();
                handleEnterLaunch();
            }
        });

        // Automatically return cursor to search bar when re-entering the tab
        function focusSearchOnTabReturn() {
            if (document.hidden) return;
            if (document.activeElement === dataInput) return;
            if (isMobileDevice) return;
            setTimeout(() => {
                if (!document.hidden && document.activeElement !== dataInput) {
                    searchInput.focus({ preventScroll: true });
                }
            }, 30);
        }

        window.addEventListener('focus', () => {
            focusSearchOnTabReturn();
            if (isDictationOn && !isRecognitionRunning && !isStartingRecognition) {
                pausedForBackgroundBlock = false;
                if (canAutoRestartSafely()) {
                    startDictation(false);
                }
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                focusSearchOnTabReturn();
                // If the browser itself interrupted background mic capture, resume immediately on return
                if (isDictationOn && !isRecognitionRunning && !isStartingRecognition) {
                    pausedForBackgroundBlock = false;
                    if (canAutoRestartSafely()) {
                        startDictation(false);
                    }
                }
            }
        });

        // =========================================================================
        // INITIALIZATION
        // =========================================================================
        window.addEventListener('DOMContentLoaded', async () => {
            applyTheme(currentTheme);

            const storedData = safeGetStorage(STORAGE_KEYS.DATA, null);
            const initialData = storedData !== null ? storedData : defaultSaveData;
            dataInput.value = initialData;
            undoStack = [initialData];
            redoStack = [];
            updateUndoRedoButtons();

            const parsed = parseSaveData(initialData);
            rootNodes = parsed.roots;
            flatItems = parsed.items;

            updateAppClipboardUI();
            updateCopyLinkModeUI();
            render();

            if (!isMobileDevice) {
                searchInput.focus();
            }

            if (isDictationOn) {
                await refreshMicPermissionState();
                startDictation(false);
            } else {
                updateDictationUI('off');
            }
        });
    </script>
</body>
</html>
